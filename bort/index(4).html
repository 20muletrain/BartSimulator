<script>
// Leaderboard storage for this device (localStorage).
if (!window.storage) {
  var K = function (k) { return "bortops:" + k; };
  window.storage = {
    get: async function (key) {
      var value = localStorage.getItem(K(key));
      if (value === null) throw new Error("key not found: " + key);
      return { key: key, value: value, shared: false };
    },
    set: async function (key, value) {
      localStorage.setItem(K(key), value);
      return { key: key, value: value, shared: false };
    },
    delete: async function (key) {
      localStorage.removeItem(K(key));
      return { key: key, deleted: true, shared: false };
    }
  };
}
</script>

:root{
  --bg:#0e1216; --top:#151b21; --panel:#141a20; --well:#0f1418; --btn:#1d252d; --btn-h:#242e37;
  --rule:#232c35; --rule-2:#2c3844; --rule-3:#3d4a56;
  --water:#0a0f14; --land:#141b22; --shore:#27323c;
  --fog:#e8eaed; --text-2:#c3ccd4; --dim:#94a1ad; --faint:#7d8a96;
  --amber:#ffb020; --blue:#2c87c8; --blue-t:#62a9dd; --go:#3f9a4c; --go-h:#48aa56;
  --ok:#5bbf68; --hot:#ef5b56; --neg:#ef7a62; --info:#6fb0e0;
  --l-yellow:#F5C518; --l-red:#E0403F; --l-orange:#F1861D; --l-green:#4DA859; --l-blue:#2C87C8;
  --free:#3fa14f; --slow:#e8b93a; --heavy:#e07b2f; --jam:#d63a3a;
  --sign:#ffb020;
  --ui:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,"Cascadia Code",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--bg);color:var(--fog);font:400 14px/1.4 var(--ui);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden;position:relative}
.app button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app :focus-visible{outline:2px solid var(--blue-t);outline-offset:2px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dim{color:var(--dim)} .small{font-size:12.5px}
.c-ok{color:var(--ok)} .c-warn{color:var(--amber)} .c-hot{color:var(--hot)} .c-neg{color:var(--neg)} .c-info{color:var(--info)} .c-dim{color:var(--dim)} .c-fog{color:var(--fog)}
.c-free{color:var(--free);font-style:normal} .c-heavy{color:var(--heavy);font-style:normal} .c-jam{color:var(--jam);font-style:normal}
.ic{display:block;flex:none}
.swatch{display:inline-block;flex:none;border-radius:2px}

/* \u2500\u2500 Header \u2500\u2500 */
.top{position:relative;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--top);border-bottom:1px solid var(--rule);min-height:50px;flex:none;z-index:20}
.home{display:flex;align-items:center;gap:2px;color:var(--faint);text-decoration:none;font:600 10.5px var(--ui);letter-spacing:.16em;text-transform:uppercase;padding:6px 8px 6px 3px;border-radius:3px}
.home:hover{color:var(--fog);background:rgba(232,234,237,.05)}
.word{display:flex;align-items:baseline;gap:9px;white-space:nowrap;padding-left:10px;border-left:1px solid var(--rule-2)}
.word b{font:800 20px/1 var(--ui);letter-spacing:.07em}
.word b i{font-style:normal;color:var(--blue-t)}
.word span{font:600 10.5px var(--ui);letter-spacing:.28em;text-transform:uppercase;color:var(--dim)}
.clock{display:flex;align-items:baseline;gap:8px;margin:0 auto;white-space:nowrap;font-family:var(--mono)}
.c-day{font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.c-time{font:600 20px/1 var(--mono);color:var(--amber);letter-spacing:-.02em;min-width:5ch;text-align:right}
.c-ampm{font:600 12px var(--mono);color:var(--amber)}
.c-week{font:500 12px var(--mono);color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin-left:2px}
.pill{align-self:center;font:800 10px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;padding:4px 7px;border-radius:3px}
.pill.rush{background:var(--amber);color:#0e1216;animation:peakPulse 1.8s ease-in-out infinite}
.pill.open{color:var(--ok);box-shadow:inset 0 0 0 1px rgba(91,191,104,.45)}
.pill.closed{background:var(--btn);color:var(--dim);box-shadow:inset 0 0 0 1px var(--rule-2)}
@keyframes peakPulse{50%{opacity:.55}}
.controls{display:flex;align-items:center;gap:6px}
.play{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 9px;border-radius:4px;border:1px solid var(--rule-2);background:var(--btn);cursor:pointer;font:600 12.5px var(--ui)!important}
.play:hover{background:var(--btn-h)}
.play.go,.play.paused{background:var(--go);border-color:var(--go);color:#fff!important}
.play.go:hover,.play.paused:hover{background:var(--go-h)}
.seg{display:inline-flex;gap:4px}
.seg button{border:1px solid var(--rule-2);background:var(--btn);height:30px;min-width:38px;padding:0 9px;border-radius:4px;font:600 12.5px var(--ui)!important;color:var(--dim)!important;cursor:pointer}
.seg button:hover{color:var(--fog)!important;background:var(--btn-h)}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff!important}
.ibtn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:4px;border:1px solid var(--rule-2);background:var(--btn);color:var(--dim)!important;cursor:pointer;padding:0}
.ibtn:hover{color:var(--fog)!important;background:var(--btn-h)}
.ibtn.on{color:#fff!important;background:#21394d;border-color:#35597a}
.ibtn.ghost{border-color:transparent;background:transparent;width:28px;height:28px}
.ibtn:disabled{opacity:.35;cursor:default}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 11px;border-radius:4px;border:1px solid var(--rule-2);background:var(--btn);cursor:pointer;font:600 12.5px var(--ui)!important;white-space:nowrap}
.btn:hover{background:var(--btn-h)}
.btn.on{background:#21394d;border-color:#35597a}
.btn.primary{background:var(--go);border-color:var(--go);color:#fff!important;font:700 13.5px var(--ui)!important;min-height:36px;padding:0 16px}
.btn.primary:hover{background:var(--go-h)}
.btn.subtle{background:transparent;border-color:transparent;color:var(--dim)!important}
.btn.subtle:hover{color:var(--fog)!important;background:rgba(232,234,237,.05)}
.btn.danger,.menu .danger{background:rgba(224,64,63,.16)!important;color:#ff8a86!important;border-color:rgba(224,64,63,.55)!important}
.btn:disabled{opacity:.4;cursor:default}
.speed-cycle{height:30px;min-width:42px;border-radius:4px;border:1px solid var(--blue);background:var(--blue);color:#fff!important;font:600 12.5px var(--ui)!important;cursor:pointer}
.menu{position:absolute;right:8px;top:calc(100% + 4px);display:flex;flex-direction:column;min-width:220px;background:var(--top);border:1px solid var(--rule-2);border-radius:6px;padding:4px;box-shadow:0 12px 30px rgba(0,0,0,.55);z-index:30}
.menu button{display:flex;align-items:center;gap:10px;border:1px solid transparent;background:none;text-align:left;padding:10px;border-radius:4px;font:500 14px var(--ui)!important;cursor:pointer}
.menu button:hover{background:rgba(232,234,237,.05)}
.rule{height:3px;flex:none;background:linear-gradient(90deg,var(--l-yellow) 0 20%,var(--l-red) 20% 40%,var(--l-orange) 40% 60%,var(--l-green) 60% 80%,var(--l-blue) 80%)}

/* \u2500\u2500 Layout \u2500\u2500 */
.body{flex:1;display:flex;min-height:0}
.map-wrap{position:relative;flex:1 1 auto;min-width:0;min-height:0;overflow:hidden;background:var(--water)}
.map-wrap::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 80% 75% at 50% 46%,transparent 58%,rgba(3,6,9,.42) 100%)}
.panel{flex:0 0 380px;overflow-y:auto;overscroll-behavior:contain;background:var(--panel);border-left:1px solid var(--rule);padding:12px 14px 26px;scrollbar-width:thin;scrollbar-color:var(--rule-2) transparent}

/* \u2500\u2500 Map \u2500\u2500 */
.map{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.map:active{cursor:grabbing}
.water{fill:var(--water)}
.land{fill:var(--land);stroke:var(--shore);stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.lake{fill:var(--water);stroke:var(--shore);stroke-width:1px;vector-effect:non-scaling-stroke}
.area{fill:#8795a1;opacity:.42;font-family:var(--ui);font-weight:600}
.area.on-water{fill:#6f94b0;opacity:.62;font-style:italic;font-weight:400}
.night{fill:#020406;pointer-events:none;transition:opacity 1s}
.road{stroke-width:1.7px;vector-effect:non-scaling-stroke;stroke-dasharray:4 4;stroke-linecap:round;animation:crawl 2s linear infinite;pointer-events:none}
.r-free{stroke:var(--free);opacity:.42;animation-duration:1s}
.r-slow{stroke:var(--slow);opacity:.6;animation-duration:2.2s}
.r-heavy{stroke:var(--heavy);opacity:.75;animation-duration:3.6s}
.r-jam{stroke:var(--jam);opacity:.9;animation-duration:7s}
@keyframes crawl{to{stroke-dashoffset:-16}}
.shield rect{fill:#12171c;stroke:var(--rule-3);stroke-width:1px;vector-effect:non-scaling-stroke}
.shield text{fill:#aab6c1;font-family:var(--ui);font-weight:700}
.rail-case{fill:none;stroke:#090d11;stroke-width:5.4px;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.rail{fill:none;stroke-width:3.1px;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;transition:opacity .25s}
.mark{fill:#0b0f13;stroke:#5b6874;stroke-width:1.3px;vector-effect:non-scaling-stroke}
.lamp{stroke:#dfe6ec;stroke-width:2.6px;stroke-linecap:round;vector-effect:non-scaling-stroke}
.st.hub .mark{stroke:#95a2ae}
.st.hub .lamp{stroke:var(--amber)}
.st.faded{opacity:.16}
.ring-track{fill:none;stroke:rgba(232,234,237,.09);stroke-width:1.8px;vector-effect:non-scaling-stroke}
.ring{fill:none;stroke-width:1.8px;stroke-linecap:round;vector-effect:non-scaling-stroke;transition:stroke-dasharray .3s}
.ring.t-calm{stroke:#56636f} .ring.t-warn{stroke:var(--amber)} .ring.t-hot{stroke:var(--l-red)}
.pulse{fill:none;stroke:var(--l-red);stroke-width:1px;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;animation:pulse 1.4s ease-out infinite;pointer-events:none}
@keyframes pulse{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(1.8)}}
.xmark{stroke:var(--l-red);stroke-width:2px;vector-effect:non-scaling-stroke;stroke-linecap:round}
.sel-ring{fill:none;stroke:#fff;stroke-width:1.4px;vector-effect:non-scaling-stroke;stroke-dasharray:3 2.5}
.event-star path{fill:var(--amber);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.lbl{fill:#a9b5c0;font-family:var(--ui);font-weight:500;paint-order:stroke;stroke:#0a0f14;stroke-opacity:.92;stroke-linejoin:round;pointer-events:none}
.lbl.t1{fill:#e6ebef;font-weight:700}
.lbl.sel{fill:var(--amber)}
.tube-cap{fill:#6f94b0;font-family:var(--ui);font-style:italic;opacity:.85}
.tbody{stroke:#0a0e12;stroke-width:1px;vector-effect:non-scaling-stroke}
.tbody.crush{stroke:#fff;stroke-width:1.3px}
.chev{fill:#0a0e12;opacity:.68}
.tr.faded{opacity:.08}
.tr.stalled .tbody{opacity:.6}
.stall-ring{fill:none;stroke:var(--l-red);stroke-width:1.4px;vector-effect:non-scaling-stroke;stroke-dasharray:2 2}

/* \u2500\u2500 Map overlays \u2500\u2500 */
.zoom-ctl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;z-index:5}
.zoom-ctl .ibtn{background:rgba(21,27,33,.94)}
.map-insp{position:absolute;left:12px;top:12px;z-index:9;max-width:calc(100% - 24px)}
.map-key{position:absolute;left:12px;top:12px;z-index:6;max-width:calc(100% - 24px)}
.toasts{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px;width:min(94%,380px);z-index:8;pointer-events:none}
.toast{width:100%;background:rgba(21,27,33,.97);border:1px solid var(--rule-2);border-left:3px solid var(--dim);border-radius:4px;padding:7px 11px;font:500 13px/1.35 var(--ui);box-shadow:0 8px 22px rgba(0,0,0,.45);animation:toastIn .25s ease-out}
.toast.t-bad{border-left-color:var(--l-red)} .toast.t-warn{border-left-color:var(--amber)} .toast.t-good{border-left-color:var(--l-green)} .toast.t-official{border-left-color:var(--blue)}
@keyframes toastIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.start-pill,.focus-pill{position:absolute;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;cursor:pointer;z-index:7;box-shadow:0 8px 22px rgba(0,0,0,.45)}
.start-pill{bottom:18px;padding:10px 18px;border-radius:4px;border:1px solid var(--go);background:var(--go);color:#fff!important;font:700 14px var(--ui)!important}
.start-pill:hover{background:var(--go-h)}
.focus-pill{top:12px;padding:6px 11px;border-radius:4px;border:1px solid var(--lc);background:rgba(21,27,33,.96);font:500 13px var(--ui)!important}
.key-toggle{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:4px;border:1px solid var(--rule-2);background:rgba(21,27,33,.94);color:var(--dim)!important;font:500 12.5px var(--ui)!important;cursor:pointer}
.mapkey{position:relative;background:rgba(15,20,24,.95);border:1px solid var(--rule-2);border-radius:6px;padding:9px 32px 9px 11px;font:400 12px/1.3 var(--ui);color:var(--dim);display:grid;gap:6px}
.k-row{display:flex;align-items:center;gap:8px}
.k-ring{fill:none;stroke-width:1.8}
.k-ring.warn{stroke:var(--amber)} .k-ring.hot{stroke:var(--l-red)}
.k-st{fill:#0b0f13;stroke:#5b6874;stroke-width:1.3}
.k-lamp{stroke:#dfe6ec;stroke-width:2.6;stroke-linecap:round}
.k-lamp.hub{stroke:var(--amber)}
.k-hint{font-size:11.5px;color:var(--faint);max-width:32ch}
.key-close{position:absolute;right:5px;top:5px;width:24px;height:24px;display:grid;place-items:center;border:0;background:none;color:var(--faint)!important;cursor:pointer;border-radius:3px}

/* Inspector and the platform sign */
.inspector{width:336px;max-width:100%;background:rgba(21,27,33,.97);border:1px solid var(--rule-2);border-radius:6px;padding:11px 13px 12px;box-shadow:0 14px 36px rgba(0,0,0,.5)}
.inspector header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.inspector h3{margin:4px 0 0;font:700 19px/1.1 var(--ui);letter-spacing:-.005em}
.insp-kicker{display:flex;align-items:center;gap:4px;font:600 10px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.insp-kicker span{margin-left:4px}
.insp-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;margin:4px 0 5px;color:var(--dim)}
.insp-row b{font:600 13px var(--mono);color:var(--fog)}
.insp-foot{margin:9px 0 0;font-size:12px;color:var(--faint)}
.insp-foot b{color:var(--fog);font:600 12px var(--mono)}
.insp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:10px}
.insp-grid span{display:block;font:600 10px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.insp-grid b{font-weight:500;font-size:13.5px}
.sign{margin-top:10px;padding:6px 10px;border-radius:3px;background-color:#050709;background-image:radial-gradient(rgba(255,176,32,.07) .8px,transparent 1.2px);background-size:3px 3px;box-shadow:inset 0 0 0 1px #1b232b,inset 0 0 16px rgba(0,0,0,.7)}
.sign-row{display:grid;grid-template-columns:8px 1fr auto 4.2em;gap:9px;align-items:center;font:600 13px/1.8 var(--mono);letter-spacing:.01em;text-transform:uppercase;color:var(--sign);text-shadow:0 0 6px rgba(255,176,32,.45)}
.sign-row i{width:8px;height:8px;border-radius:1px;box-shadow:0 0 5px currentColor}
.sign-dest{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sign-min{text-align:right}
.sign-cars{text-align:right;opacity:.75}
.sign-msg{font:600 13px/1.8 var(--mono);letter-spacing:.06em;color:var(--sign);text-shadow:0 0 6px rgba(255,176,32,.45);text-align:center}

/* Briefing */
.setup{position:absolute;left:14px;top:14px;z-index:9;width:min(410px,calc(100% - 28px));max-height:calc(100% - 28px);overflow:auto;background:rgba(21,27,33,.97);border:1px solid var(--rule-2);border-radius:8px;padding:16px 18px 14px;box-shadow:0 16px 44px rgba(0,0,0,.55)}
.kicker{display:block;font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}
.setup h2,.modal h2{font:700 24px/1.15 var(--ui);letter-spacing:-.01em;margin:6px 0 10px}
.setup-list{margin:0 0 12px;padding:0;list-style:none;display:grid;gap:7px}
.setup-list li{position:relative;padding-left:16px;font-size:13.5px;line-height:1.5;color:var(--text-2)}
.setup-list li::before{content:"";position:absolute;left:1px;top:.55em;width:7px;height:7px;border-radius:1px}
.setup-list li:nth-child(1)::before{background:var(--l-yellow)} .setup-list li:nth-child(2)::before{background:var(--l-red)} .setup-list li:nth-child(3)::before{background:var(--l-blue)}
.setup-list b{color:var(--fog);font:600 13px var(--mono)}
.setup-label{display:block;font:600 10.5px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:4px 0 6px}
.setup-presets{display:flex;gap:4px;flex-wrap:wrap}
.setup-presets button{flex:1 1 auto;min-height:32px;padding:0 10px;border-radius:4px;border:1px solid var(--rule-2);background:var(--btn);cursor:pointer;font:600 12.5px var(--ui)!important;color:var(--dim)!important}
.setup-presets button:hover{color:var(--fog)!important}
.setup-presets button.on{background:var(--blue);border-color:var(--blue);color:#fff!important}
.setup-blurb{margin:8px 0 12px;font-size:13px;line-height:1.45;color:var(--dim);min-height:2.9em}
.setup-go{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fine{margin:12px 0 0;padding-top:9px;border-top:1px solid var(--rule);font-size:11px;line-height:1.5;color:var(--faint)}
.setup-sheet{position:absolute;inset:50px 0 0 0;z-index:25;background:rgba(6,9,12,.94);overflow:auto;padding:10px 10px 24px}
.setup-sheet .setup{position:relative;left:auto;top:auto;width:100%;max-height:none;max-width:560px;margin:0 auto}

/* \u2500\u2500 Panel \u2500\u2500 */
.advisor{display:flex;gap:10px;align-items:center;min-height:56px;padding:9px 11px;border-radius:6px;background:#1a222a;border:1px solid var(--rule-2)}
.advisor p{margin:0;font:400 13px/1.45 var(--ui);color:#d9dfe4}
.adv-mark{flex:none;width:3px;align-self:stretch;border-radius:2px;background:var(--dim)}
.advisor.t-bad{background:#27171a;border-color:rgba(224,64,63,.55)} .advisor.t-bad .adv-mark{background:var(--l-red)}
.advisor.t-warn{background:#261f10;border-color:rgba(255,176,32,.5)} .advisor.t-warn .adv-mark{background:var(--amber)}
.advisor.t-good{background:#14231a;border-color:rgba(77,168,89,.55)} .advisor.t-good .adv-mark{background:var(--l-green)}
.vitals{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 2px}
.vitals>div{background:var(--well);border:1px solid var(--rule);border-radius:6px;padding:8px 9px 7px;min-width:0}
.v-label{display:block;font:600 10px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.v-num{display:block;font:600 19px/1.2 var(--mono);letter-spacing:-.03em;margin:4px 0 2px;white-space:nowrap}
.v-sub{display:block;font:400 11.5px/1.3 var(--ui);color:var(--faint)}
.eyebrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:600 10.5px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:14px 0 6px}
.eyebrow-r{font:400 12px var(--ui);letter-spacing:0;text-transform:none;text-align:right}
.bar{height:7px;background:var(--well);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.bar.thin{height:4px;border:0;background:rgba(232,234,237,.08);border-radius:2px}
.bar i{display:block;height:100%;transition:width .35s}
.bar i.t-ok{background:var(--l-green)} .bar i.t-warn{background:var(--amber)} .bar i.t-hot{background:var(--l-red)} .bar i.t-calm{background:#687887} .bar i.t-info{background:var(--blue)}
.mood-top{display:flex;align-items:center;gap:12px}
.mood-num{font:600 26px/1 var(--mono);letter-spacing:-.04em}
.mood-num small{font-size:.55em;margin-left:1px;letter-spacing:0}
.mood-bar{flex:1}
.drivers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:9px}
.driver{min-width:0}
.d-label{display:block;font:600 10px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-val{display:block;font:500 12px var(--mono);color:var(--faint);margin-top:3px}
.rep{margin:8px 0 0;font-size:12px;color:var(--faint)}
.rep b{color:var(--dim);font:600 12px var(--mono)}
.daycurve-wrap{position:relative}
.daycurve{display:block;width:100%}
.dc-closed{fill:rgba(0,0,0,.32)}
.dc-win{fill:var(--lc,var(--amber));opacity:.17}
.dc-area{fill:rgba(44,135,200,.15)}
.dc-line{fill:none;stroke:var(--blue-t);stroke-width:1.4px;vector-effect:non-scaling-stroke}
.dc-now{stroke:var(--amber);stroke-width:1.3px;vector-effect:non-scaling-stroke;stroke-dasharray:3 3}
.dc-ticks{position:relative;height:14px;font:500 9.5px var(--mono);color:var(--faint)}
.dc-ticks span{position:absolute;top:3px;transform:translateX(-50%)}
.dc-ticks span:nth-child(1){left:0;transform:none} .dc-ticks span:nth-child(2){left:25%} .dc-ticks span:nth-child(3){left:50%} .dc-ticks span:nth-child(4){left:75%} .dc-ticks span:nth-child(5){right:0;transform:none}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.gauge{background:var(--well);border:1px solid var(--rule);border-radius:6px;padding:8px 9px}
.g-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:6px}
.g-top span{white-space:nowrap;font:600 10px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.g-top b{font:600 13px var(--mono)}
.g-top small{font:500 11px var(--mono);color:var(--faint);margin-left:1px}
.g-sub{display:block;margin-top:6px;font-size:11.5px;color:var(--faint)}
.tabs{position:sticky;top:-12px;z-index:4;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:14px -14px 0;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--rule)}
.tabs button{height:30px;border-radius:4px;border:1px solid var(--rule);background:var(--well);cursor:pointer;font:600 12.5px var(--ui)!important;color:var(--dim)!important}
.tabs button:hover{color:var(--fog)!important;border-color:var(--rule-2)}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff!important}
.tab-body{padding-top:4px}
.card{background:var(--well);border:1px solid var(--rule);border-radius:6px;padding:11px}
.hint{margin:8px 0 0;font-size:12px;line-height:1.45;color:var(--faint)}
.footnote{margin:20px 0 0;font-size:11.5px;line-height:1.5;color:var(--faint)}

/* Lines tab */
.fare .eyebrow{margin-top:0}
.fare-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fare-val{font:600 24px/1 var(--mono);letter-spacing:-.03em}
.range{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:8px 0 0;cursor:pointer;touch-action:pan-y}
.range::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--amber) var(--pct),rgba(232,234,237,.12) var(--pct))}
.range::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--amber) var(--pct),rgba(232,234,237,.12) var(--pct))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--amber);border:3px solid var(--well);margin-top:-6px;box-shadow:0 0 0 1px rgba(255,176,32,.6)}
.range::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--amber);border:3px solid var(--well)}
.stepper{display:inline-flex;align-items:center;background:var(--bg);border:1px solid var(--rule-2);border-radius:4px;height:30px}
.stepper button{width:28px;height:100%;display:grid;place-items:center;border:0;background:none;color:var(--dim)!important;cursor:pointer;border-radius:3px}
.stepper button:hover:not(:disabled){color:var(--fog)!important;background:rgba(232,234,237,.06)}
.stepper button:disabled{opacity:.3;cursor:default}
.stepper output{min-width:3.8em;text-align:center;font:500 12.5px var(--mono)}
.stepper.sm{height:28px}
.stepper.sm button{width:26px}
.stepper.sm output{min-width:4.4em;font-size:12px}
.presets{display:grid;gap:4px}
.preset{display:grid;gap:2px;text-align:left;padding:8px 11px;border-radius:6px;border:1px solid var(--rule);background:var(--well);cursor:pointer}
.preset:hover{border-color:var(--rule-3)}
.preset b{font:700 13.5px var(--ui)}
.preset span{font-size:12px;line-height:1.4;color:var(--faint)}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.chip{position:relative;display:grid;gap:3px;text-align:left;padding:8px 7px 7px;border-radius:4px;border:1px solid var(--rule);background:var(--well);cursor:pointer;overflow:hidden;min-width:0}
.chip::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--lc)}
.chip:hover{border-color:var(--rule-3)}
.chip.on{border-color:var(--lc);box-shadow:inset 0 0 0 1px var(--lc)}
.chip.parked{opacity:.5}
.chip-name{font:700 11.5px var(--ui);letter-spacing:.06em;text-transform:uppercase}
.chip-plan{font:500 11px var(--ui);color:var(--dim);white-space:nowrap}
.chip-load{display:block;height:3px;background:rgba(232,234,237,.1);border-radius:2px;overflow:hidden}
.chip-load i{display:block;height:100%;background:var(--lc);transition:width .35s}
.editor{margin-top:6px;border-top:3px solid var(--lc)}
.ed-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ed-head h4{display:flex;align-items:center;gap:7px;margin:0;font:700 17px/1.1 var(--ui)}
.route{display:block;margin-top:4px;font-size:12px;color:var(--faint)}
.ed-now{margin:10px 0 8px;font:500 13px var(--ui);color:var(--amber)}
.switch{display:inline-flex;align-items:center;gap:7px;border:0;background:none;cursor:pointer;padding:4px 0;font:500 12.5px var(--ui)!important;color:var(--dim)!important}
.switch .knob{position:relative;width:32px;height:18px;border-radius:9px;background:var(--rule-2);transition:background .2s}
.switch .knob::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--fog);transition:transform .2s}
.switch.on .knob{background:var(--go)}
.switch.on .knob::after{transform:translateX(14px)}
.switch.on{color:var(--fog)!important}
.plans{width:100%;border-collapse:collapse}
.plans th,.plans td{padding:3px 0}
.plans thead th{font:600 10px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);text-align:left;padding-bottom:6px}
.plans tbody th{font:500 13px var(--ui);text-align:left;color:var(--dim);white-space:nowrap;padding-right:6px}
.plans tbody th em{display:block;font:700 9.5px var(--ui);font-style:normal;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
.plans tr.active th{color:var(--fog)}
.plans tr.active .stepper{border-color:rgba(255,176,32,.6)}
.windows{margin-top:6px}
.win-grid{display:grid;grid-template-columns:auto auto auto auto;align-items:center;justify-content:start;gap:5px 8px;font:500 13px var(--ui);color:var(--dim)}
.win-grid .to{color:var(--faint);font-weight:400}
.windows .daycurve-wrap{margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
.stats span{display:block;font:600 10px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.stats b{display:block;font:500 13.5px/1.3 var(--ui);overflow-wrap:anywhere;margin-top:2px}
.ed-actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}

/* Money tab */
.ledger hr{border:0;border-top:1px solid var(--rule);margin:7px 0}
.row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:13px;color:var(--dim)}
.row b{font:500 13px var(--mono);color:var(--fog)}
.row b.c-ok{color:var(--ok)} .row b.c-neg{color:var(--neg)} .row b.c-warn{color:var(--amber)} .row b.c-hot{color:var(--hot)} .row b.c-info{color:var(--info)}
.row.big{font-size:14px;color:var(--fog);font-weight:600}
.row.big b{font-size:14px;font-weight:600}
.upgroup h5{margin:12px 0 5px;font:600 10.5px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.upgrade{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:6px;background:var(--well);border:1px solid var(--rule);margin-bottom:5px}
.up-text{flex:1;min-width:0}
.up-text b{font-weight:700;font-size:13.5px;margin-right:8px}
.up-text p{margin:3px 0 0;font-size:12px;color:var(--faint)}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips i{width:12px;height:4px;border-radius:1px;background:rgba(232,234,237,.16)}
.pips i.on{background:var(--amber)}
.buy{min-width:80px;justify-content:center;font-family:var(--mono)!important;font-weight:500!important}
.buy.go{background:var(--go);border-color:var(--go);color:#fff!important}
.buy.go:hover{background:var(--go-h)}

/* City tab */
.race{display:grid;gap:6px}
.racer{background:var(--well);border:1px solid var(--rule);border-radius:6px;padding:9px 11px}
.racer.win{border-color:var(--blue);box-shadow:inset 3px 0 0 var(--blue)}
.r-mode{display:flex;align-items:center;gap:7px;font:600 10.5px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.racer>b{display:block;font:600 22px/1.15 var(--mono);letter-spacing:-.03em;margin:5px 0 6px}
.r-track{height:4px;border-radius:2px;background:rgba(232,234,237,.08);overflow:hidden}
.r-track i{display:block;height:100%;transition:width .4s}
.r-track .f-yellow{background:var(--l-yellow)} .r-track .f-free{background:var(--free)} .r-track .f-slow{background:var(--slow)} .r-track .f-heavy{background:var(--heavy)} .r-track .f-jam{background:var(--jam)}
.r-sub{display:block;margin-top:6px;font-size:12px;color:var(--faint)}
.event{display:flex;gap:10px;align-items:center;margin-top:8px;background:#1f1a0e;border-color:rgba(255,176,32,.45)}
.event b{font-weight:700}
.event p{margin:2px 0 0;font-size:12px;color:var(--dim)}
.event .btn{margin-left:auto}
.ev-star{color:var(--amber);font-size:18px}
.board-pick select{width:100%;height:34px;border-radius:4px;border:1px solid var(--rule-2);background:var(--well);color:var(--fog);font:400 13.5px var(--ui);padding:0 8px}
.feed{list-style:none;margin:0;padding:0;display:grid}
.feed li{padding:7px 0;border-bottom:1px solid var(--rule);font-size:13px;line-height:1.4}
.feed li:last-child{border-bottom:0}
.feed time{display:inline-block;min-width:5.8em;font:500 11.5px var(--mono);color:var(--faint)}

/* Scores tab */
.score-num{display:block;font:600 34px/1.05 var(--mono);letter-spacing:-.04em}
.badge{display:inline-block;font:700 10px var(--ui);letter-spacing:.12em;text-transform:uppercase;padding:3px 6px;border-radius:3px;background:var(--btn);color:var(--dim);box-shadow:inset 0 0 0 1px var(--rule-2)}
.badge.global{background:#14231a;color:var(--ok);box-shadow:inset 0 0 0 1px rgba(77,168,89,.55)}
.board{list-style:none;margin:0 0 10px;padding:0;background:var(--well);border:1px solid var(--rule);border-radius:6px}
.board li{display:grid;grid-template-columns:2em 3.8em 1fr;grid-template-rows:auto auto;column-gap:8px;padding:7px 11px;border-bottom:1px solid var(--rule)}
.board li:last-child{border-bottom:0}
.board li.empty{display:block;color:var(--faint);font-size:13px}
.b-rank{grid-row:1/3;font:600 16px var(--mono);color:var(--faint)}
.board li.first .b-rank{color:var(--amber)}
.b-name{font:700 14px var(--mono);letter-spacing:.08em}
.b-score{font:600 15px var(--mono);text-align:right}
.b-meta{grid-column:2/4;font-size:11.5px;color:var(--faint)}

/* Modals */
.overlay{position:absolute;inset:0;z-index:40;display:grid;place-items:center;padding:14px;background:rgba(6,9,12,.8)}
.modal{width:min(540px,100%);max-height:calc(100% - 10px);overflow:auto;background:var(--top);border:1px solid var(--rule-2);border-radius:10px;padding:18px 20px;box-shadow:0 22px 56px rgba(0,0,0,.6)}
.modal.center{text-align:center}
.modal p{font-size:14px;line-height:1.5}
.grade-row{display:flex;align-items:center;gap:18px;margin:6px 0 12px}
.grade{flex:none;display:grid;place-items:center;width:76px;height:76px;border:2px solid currentColor;border-radius:6px;font:700 46px/1 var(--ui)}
.targets{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:13.5px}
.targets li span{display:inline-block;width:1.3em;font-weight:700}
.targets li.met span{color:var(--ok)} .targets li.miss span{color:var(--hot)}
.targets em{font:500 12.5px var(--mono);font-style:normal;color:var(--faint);margin-left:4px}
.week-score{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px;margin:4px 0 12px}
.week-score span{font:600 10.5px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.week-score b{font:600 28px var(--mono);letter-spacing:-.03em;color:var(--amber)}
.week-score em{font-style:normal;font-size:13px;font-weight:600}
.charts{display:flex;gap:18px;flex-wrap:wrap}
.minibars{margin:0}
.minibars figcaption{font:600 10px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.minibars .axis{stroke:var(--rule-2)}
.minibars .f-ok{fill:var(--l-green)} .minibars .f-neg{fill:var(--l-red)} .minibars .f-info{fill:var(--blue)}
.minibars-days{display:flex;justify-content:space-around;width:168px;font:500 10px var(--mono);color:var(--faint)}
.rev-notes{color:var(--text-2)}
blockquote{margin:12px 0 14px;padding:0 0 0 12px;border-left:2px solid currentColor;font:italic 400 14.5px/1.45 var(--ui)}
.bank{display:flex;align-items:flex-end;flex-wrap:wrap;gap:8px}
.bank label{display:grid;gap:4px;font:600 10.5px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.bank input{width:78px;height:36px;border-radius:4px;border:1px solid var(--rule-2);background:var(--bg);color:var(--amber);font:600 18px var(--mono);letter-spacing:.12em;text-align:center;text-transform:uppercase}

/* \u2500\u2500 Phone \u2500\u2500 */
.is-phone{font-size:14px}
.is-phone .top{gap:8px;padding:0 8px;min-height:46px}
.is-phone .home{padding:6px 2px}
.is-phone .home span,.is-phone .c-week,.is-phone .pill,.is-phone .word span{display:none}
.is-phone .word{display:none;padding-left:8px}
.is-phone .word b{font-size:17px}
.is-phone .clock{gap:6px}
.is-phone .c-day{font-size:11.5px}
.is-phone .c-time{font-size:18px}
.is-phone .c-ampm{font-size:11.5px}
.is-phone .controls{gap:5px}
.is-phone .play{width:36px;height:32px;padding:0;justify-content:center}
.is-phone .speed-cycle{height:32px}
.is-phone .ibtn{height:32px;width:34px}
.is-phone .body{flex-direction:column}
.is-phone .map-wrap{flex:0 0 41%;transition:flex-basis .25s}
.is-phone.sheet-big .map-wrap{flex-basis:20%}
.is-phone .panel{flex:1 1 0;border-left:0;border-top:1px solid var(--rule-2);border-radius:10px 10px 0 0;margin-top:-10px;position:relative;z-index:2;padding:0 12px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.4)}
.is-phone .handle{position:sticky;top:0;z-index:5;display:block;width:calc(100% + 24px);margin:0 -12px 6px;height:22px;border:0;background:var(--panel);cursor:pointer;border-radius:10px 10px 0 0}
.is-phone .handle span{display:block;width:40px;height:4px;border-radius:2px;background:var(--rule-3);margin:0 auto}
.is-phone .tabs{top:16px;margin:12px -12px 0;padding:8px 12px}
.is-phone .tabs button{height:32px}
.is-phone .advisor{min-height:54px}
.is-phone .map-insp{left:8px;right:8px;top:auto;bottom:18px}
.is-phone .map-key{left:8px;right:auto;top:auto;bottom:18px;max-width:calc(100% - 64px)}
.is-phone .zoom-ctl{right:8px;bottom:18px}
.is-phone .zoom-ctl .ibtn{width:34px;height:34px}
.is-phone .inspector{width:100%;padding:10px 12px;margin:0 0 10px;box-shadow:none;background:#1a222a}
.is-phone .inspector h3{font-size:18px}
.is-phone .sign-row{font-size:12.5px}
.is-phone .toasts{top:8px}
.is-phone .toast{font-size:12.5px;padding:5px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.is-phone .start-pill{bottom:22px}
.is-phone .focus-pill{top:8px}
.is-phone .setup h2{font-size:22px}
.is-phone .kbd-only{display:none}
.is-phone .modal{padding:16px}
.is-phone .grade{width:64px;height:64px;font-size:38px}
.is-phone .menu{top:calc(100% + 4px)}
@media (min-width:420px){.is-phone .word{display:flex}}
@media (min-width:600px){.is-phone .word span{display:inline}}

/* \u2500\u2500 Narrower wide screens (small laptops, tablets and phones held sideways) \u2500\u2500 */
@media (max-width:1180px){
  .is-wide .top{gap:10px}
  .is-wide .c-week{display:none}
  .is-wide .restart:not(.danger) span{display:none}
  .is-wide .restart:not(.danger){padding:0 8px}
}
@media (max-width:1060px){
  .is-wide .home span,.is-wide .word span{display:none}
}
@media (max-width:900px){
  .is-wide .word,.is-wide .pill{display:none}
  .is-wide .play{width:36px;padding:0;justify-content:center}
  .is-wide .play span{display:none}
  .is-wide .panel{flex-basis:340px}
}

@media (prefers-reduced-motion:reduce){
  .road,.pulse,.event-star path,.toast,.pill.rush{animation:none!important}
  .bar i,.ring,.chip-load i,.r-track i,.night,.map-wrap{transition:none!important}
}
