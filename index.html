<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1a27">
<meta name="description" content="Port New Oakland: run a ship-to-shore container crane on the Oakland waterfront.">
<title>Port New Oakland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&display=swap">
<style>
:root{
  --navy:#10263a;--panel:rgba(11,27,41,.78);--panel-strong:rgba(9,22,34,.94);--line:rgba(238,241,240,.14);--line-2:rgba(238,241,240,.26);
  --ink:#eef1f0;--dim:#9fb0bc;--faint:#6f8494;--yellow:#f2b705;--rust:#d0533a;--green:#43b36f;--amber:#ff9f1c;--cyan:#4fd1ff;--bg:#0b1a27;
  --f-ui:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-sten:'Big Shoulders Stencil Display','Big Shoulders Stencil','Allerta Stencil',Impact,'Arial Narrow',sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a27;--ink:#eef1f0;--panel:rgba(11,27,41,.78);}}
:root[data-theme="dark"]{--bg:#0b1a27;--ink:#eef1f0;--panel:rgba(11,27,41,.78);}
*,*::before,*::after{box-sizing:inherit;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
[hidden]{display:none!important;}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;}
button{font:inherit;}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;font-family:var(--f-ui);color:var(--ink);z-index:5;}
.hp{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px 10px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-variant-numeric:tabular-nums;box-shadow:0 6px 24px rgba(0,0,0,.25);}
.tl{top:calc(var(--sat) + 12px);left:calc(var(--sal) + 12px);width:min(360px,36vw);}
.tc{top:calc(var(--sat) + 12px);left:50%;transform:translateX(-50%);text-align:center;min-width:190px;}
.tr{top:calc(var(--sat) + 12px);right:calc(var(--sar) + 12px);width:min(250px,28vw);}
.bl{bottom:calc(var(--sab) + 12px);left:calc(var(--sal) + 12px);width:190px;}
.br{bottom:calc(var(--sab) + 12px);right:calc(var(--sar) + 12px);width:min(250px,28vw);}
.hp .lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600;}
.hp .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:3px;}
.hp b{font-weight:700;font-size:20px;}
.hp .sub{font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hp .dim{color:var(--dim);}
.tag{font-size:12px;color:var(--dim);letter-spacing:.06em;}
.act{font-size:24px;font-weight:700;color:var(--yellow);line-height:1.1;margin-top:2px;}
.route{font-size:19px;font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.clock{font-size:34px;font-weight:700;line-height:1;letter-spacing:.02em;}
#hc-left.warn{color:var(--amber);}#hc-left.late{color:#ff8a72;}
.gauge{position:relative;height:10px;margin:7px 0 5px;border-radius:5px;background:linear-gradient(90deg,var(--rust) 0 25%,var(--amber) 25% 34.4%,rgba(67,179,111,.65) 34.4% 65.6%,var(--amber) 65.6% 75%,var(--rust) 75% 100%);}
.gauge i{position:absolute;top:-4px;width:3px;height:18px;margin-left:-1.5px;background:var(--ink);border-radius:2px;left:50%;box-shadow:0 0 6px rgba(0,0,0,.7);}
#h-env.caution{border-color:var(--amber);}#h-env.alarm{border-color:var(--rust);box-shadow:0 0 0 2px rgba(208,83,58,.45);}
.arrow{display:inline-block;font-size:18px;color:var(--cyan);transition:transform .4s;}
.sway{position:relative;width:64px;height:64px;border-radius:50%;border:1px solid var(--line-2);margin:6px auto 0;}
.sway::before,.sway::after{content:'';position:absolute;background:var(--line);}
.sway::before{left:50%;top:6px;bottom:6px;width:1px;}.sway::after{top:50%;left:6px;right:6px;height:1px;}
.sway i{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--yellow);left:50%;top:50%;box-shadow:0 0 8px rgba(242,183,5,.7);}
.warn{color:var(--amber);}
.lamps{display:flex;gap:6px;margin:6px 0 4px;}
.lamp{flex:1;text-align:center;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 0;border-radius:6px;border:1px solid var(--line);color:var(--faint);background:rgba(255,255,255,.03);}
#hs-land.on{background:var(--amber);color:#1b1206;border-color:var(--amber);}
#hs-lock.on{background:var(--green);color:#06140c;border-color:var(--green);}
#toasts{position:absolute;top:calc(var(--sat) + 108px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:min(460px,64vw);}
.toast{display:flex;gap:12px;align-items:baseline;justify-content:space-between;background:var(--panel-strong);border:1px solid var(--line);border-left:3px solid var(--cyan);border-radius:8px;padding:6px 12px;font-size:16px;font-weight:600;animation:tin .25s ease-out;transition:opacity .4s,transform .4s;max-width:100%;}
.toast.bad{border-left-color:var(--rust);}.toast.bad b{color:#ff8a72;}.toast.hint{border-left-color:var(--yellow);}.toast.warn{border-left-color:var(--amber);}
.toast b{color:#8ee6a8;font-weight:700;white-space:nowrap;}
.toast.out{opacity:0;transform:translateY(-6px);}
@keyframes tin{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
#radio{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 18px);max-width:min(620px,52vw);background:var(--panel-strong);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:17px;font-weight:500;display:flex;gap:10px;align-items:baseline;}
#radio .who{color:var(--yellow);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;}
#banner{position:absolute;left:50%;top:calc(var(--sat) + 150px);transform:translateX(-50%);text-align:center;background:rgba(208,83,58,.93);color:#fff;border-radius:12px;padding:10px 22px;box-shadow:0 10px 40px rgba(0,0,0,.4);max-width:80vw;}
#banner b{display:block;font-family:var(--f-sten);font-weight:800;font-size:clamp(30px,5vw,54px);letter-spacing:.03em;text-transform:uppercase;line-height:1;}
#banner span{font-size:16px;font-weight:600;}
#autoOv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,80vw);text-align:center;background:var(--panel-strong);border:1px solid var(--line-2);border-radius:12px;padding:16px 22px;}
#autoOv b{display:block;font-size:26px;font-weight:700;color:var(--yellow);}#autoOv span{display:block;font-size:16px;color:var(--dim);margin:4px 0 10px;}
#autoOv .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;}#autoOv .bar i{display:block;height:100%;background:var(--yellow);width:0;transition:width .15s linear;}
#autoOv .bar.indet i{animation:indet 1.4s ease-in-out infinite;}@keyframes indet{0%{transform:translateX(-100%);}100%{transform:translateX(300%);}}
#tut{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 84px);width:min(540px,56vw);background:var(--panel-strong);border:1px solid var(--yellow);border-radius:12px;padding:12px 16px;pointer-events:auto;}
#tut p{margin:0 0 10px;font-family:var(--f-body);font-size:16px;line-height:1.45;}
#tut .row{display:flex;gap:8px;margin-top:0;}
#spcam-frame{position:fixed;right:calc(var(--sar) + 12px);bottom:calc(var(--sab) + 162px);width:min(260px,24vw);aspect-ratio:4/3;border:1px solid var(--line-2);border-radius:10px;pointer-events:none;z-index:6;box-shadow:0 6px 24px rgba(0,0,0,.35);}
#spcam-frame span{position:absolute;left:8px;top:6px;font:600 11px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-shadow:0 1px 2px #000;}
.xh{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border:1px solid rgba(79,209,255,.8);border-radius:50%;}
/* touch */
#touch{position:fixed;inset:0;pointer-events:none;z-index:7;font-family:var(--f-ui);}
.stick{position:absolute;bottom:calc(var(--sab) + 16px);width:148px;height:148px;border-radius:50%;background:rgba(11,27,41,.45);border:1px solid var(--line-2);pointer-events:auto;touch-action:none;}
#stk-l{left:calc(var(--sal) + 16px);}
#stk-r{right:calc(var(--sar) + 16px);width:76px;height:168px;border-radius:38px;}
.knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(242,183,5,.9);box-shadow:0 2px 10px rgba(0,0,0,.4);pointer-events:none;}
.stick .cap{position:absolute;left:-20px;right:-20px;top:-19px;text-align:center;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);}
.tbtns{position:absolute;right:calc(var(--sar) + 102px);bottom:calc(var(--sab) + 18px);display:flex;flex-direction:column;gap:8px;pointer-events:auto;}
.ttop{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 16px);display:flex;gap:6px;pointer-events:auto;}
.tbtn{font:700 15px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:var(--panel-strong);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;min-width:58px;touch-action:none;}
.tbtn.big{padding:16px 14px;background:var(--yellow);color:#10263a;border-color:var(--yellow);}
.tbtn.on{background:var(--cyan);color:#062130;border-color:var(--cyan);}
@media (pointer:coarse){
  .hp{padding:6px 9px;border-radius:8px;}
  .tl{width:min(290px,38vw);}.act{font-size:17px;}.route{font-size:15px;}#hm-box,#hm-next{display:none;}
  .clock{font-size:24px;}.hp b{font-size:16px;}.hp .sub{font-size:12px;}.hp .lbl{font-size:10px;}
  .bl{bottom:auto;top:calc(var(--sat) + 104px);width:150px;}.sway{width:44px;height:44px;}
  .br{bottom:auto;top:calc(var(--sat) + 128px);width:170px;}.tr{width:170px;}
  #radio{bottom:calc(var(--sab) + 190px);font-size:14px;max-width:62vw;}
  #toasts{top:calc(var(--sat) + 84px);}.toast{font-size:13px;}
  #tut{bottom:auto;top:calc(var(--sat) + 84px);width:min(420px,52vw);}#tut p{font-size:14px;}
  #spcam-frame{bottom:auto;top:calc(var(--sat) + 250px);width:150px;}
}
/* menus */
#screen{position:fixed;inset:0;z-index:20;overflow-y:auto;overflow-x:hidden;padding:calc(var(--sat) + 32px) calc(var(--sar) + 28px) calc(var(--sab) + 32px) calc(var(--sal) + clamp(22px,6vw,84px));
  background:linear-gradient(90deg,rgba(7,18,28,.95) 0%,rgba(7,18,28,.84) 34%,rgba(7,18,28,.3) 62%,rgba(7,18,28,0) 82%);-webkit-overflow-scrolling:touch;touch-action:pan-y;user-select:text;-webkit-user-select:text;}
#screen.wide{background:linear-gradient(90deg,rgba(7,18,28,.96) 0%,rgba(7,18,28,.9) 55%,rgba(7,18,28,.6) 100%);}
.menu{max-width:560px;}
#screen.wide .menu{max-width:880px;}
.kicker{font-family:var(--f-ui);font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--yellow);}
.kicker.alarm{color:#ff8a72;}
h1.stencil{font-family:var(--f-sten);font-weight:800;font-size:clamp(52px,9vw,112px);line-height:.86;text-transform:uppercase;margin:10px 0 16px;text-wrap:balance;}
.stencil.sm{font-family:var(--f-sten);font-weight:800;font-size:clamp(36px,5.5vw,64px);line-height:.9;text-transform:uppercase;margin:6px 0 12px;}
.menu h2{font-family:var(--f-ui);font-weight:700;font-size:clamp(26px,3.4vw,36px);margin:4px 0 10px;line-height:1.05;}
.lede{font-size:17px;line-height:1.5;color:#d6dee3;max-width:54ch;margin:0 0 16px;}
.foot{font-size:13px;color:var(--faint);margin-top:26px;max-width:54ch;}
.menu-list{display:flex;flex-direction:column;margin-top:18px;border-top:1px solid var(--line);max-width:470px;}
.mi{display:flex;align-items:center;gap:16px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);padding:12px 4px;text-align:left;cursor:pointer;font-family:var(--f-ui);}
.mi .n{font-family:var(--f-sten);font-weight:800;color:var(--yellow);font-size:22px;width:30px;}
.mi .l{display:flex;flex-direction:column;}.mi .l span{font-size:25px;font-weight:600;line-height:1.1;}.mi .l small{font-family:var(--f-body);font-size:13px;color:var(--dim);margin-top:2px;}
.mi:hover .l span,.mi:focus-visible .l span{color:var(--yellow);}.mi:focus-visible{outline:2px solid var(--yellow);outline-offset:2px;}
.btn{font-family:var(--f-ui);font-size:18px;font-weight:600;letter-spacing:.02em;padding:10px 18px;border-radius:8px;border:1px solid var(--line-2);background:rgba(255,255,255,.06);color:var(--ink);cursor:pointer;}
.btn:hover{background:rgba(255,255,255,.12);}.btn:focus-visible{outline:2px solid var(--yellow);outline-offset:2px;}
.btn.primary{background:var(--yellow);border-color:var(--yellow);color:#10263a;}.btn.primary:hover{background:#ffc93a;}
.btn.small{font-size:15px;padding:6px 12px;}.btn.on{background:var(--cyan);border-color:var(--cyan);color:#062130;}.btn.ghost{background:none;}
.btn.danger{color:#ff8a72;border-color:rgba(208,83,58,.5);}.btn.wide{width:100%;}.btn:disabled{opacity:.42;cursor:default;}
.link{background:none;border:0;color:var(--cyan);font:inherit;cursor:pointer;padding:0;text-decoration:underline;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px;}
.signin label{display:block;font-family:var(--f-ui);font-size:19px;font-weight:600;margin:8px 0 8px;}
.signin input{font:600 20px var(--f-ui);padding:10px 12px;border-radius:8px;border:1px solid var(--line-2);background:rgba(0,0,0,.35);color:var(--ink);width:230px;}
.who{font-size:15px;color:var(--dim);}
.hall-top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;}
.hall-top .stats{display:flex;gap:24px;}.hall-top small{display:block;font-family:var(--f-ui);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);}.hall-top .stats b{font-family:var(--f-ui);font-size:26px;font-variant-numeric:tabular-nums;}
.note{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:rgba(242,183,5,.1);border:1px solid rgba(242,183,5,.35);border-radius:10px;padding:10px 14px;margin:12px 0;}
.tier-h{font-family:var(--f-ui);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:20px 0 6px;font-weight:600;}.tier-h span{color:var(--yellow);}
.job{display:grid;grid-template-columns:52px 1fr auto 70px;gap:14px;align-items:center;width:100%;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:6px;color:var(--ink);cursor:pointer;font-family:var(--f-ui);}
.job:hover:not(:disabled){border-color:var(--yellow);background:rgba(242,183,5,.06);}
.job-id{font-family:var(--f-sten);font-weight:800;font-size:22px;color:var(--yellow);}
.job-main{display:flex;flex-direction:column;}.job-main b{font-size:21px;}.job-main span{font-family:var(--f-body);font-size:14px;color:var(--dim);}
.job-meta{display:flex;flex-direction:column;align-items:flex-end;font-size:15px;color:var(--dim);font-variant-numeric:tabular-nums;}
.job-grade{text-align:right;font-size:14px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;}.job-grade.g{font-family:var(--f-sten);font-weight:800;font-size:28px;color:var(--ink);text-transform:none;}
.job.locked{opacity:.45;cursor:default;}
.kvs{display:flex;flex-direction:column;border-top:1px solid var(--line);margin:8px 0;}
.kv{display:flex;justify-content:space-between;gap:16px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:15px;}
.kv span{color:var(--dim);}.kv b{font-family:var(--f-ui);font-size:18px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;}
.kv b.neg{color:#ff8a72;}.kv b.warn{color:var(--amber);}.kv.total b{font-size:22px;color:var(--yellow);}.kv.me{background:rgba(242,183,5,.1);}
.kbd{font-family:var(--f-ui);font-weight:700;color:var(--ink)!important;background:rgba(255,255,255,.08);border:1px solid var(--line-2);border-radius:6px;padding:2px 8px;white-space:nowrap;}
.set{display:grid;grid-template-columns:190px 1fr;gap:6px 14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
.set label{font-family:var(--f-ui);font-size:18px;font-weight:600;}.set small{grid-column:2;font-size:13px;color:var(--dim);}
.seg{display:flex;gap:6px;flex-wrap:wrap;}
input[type=range]{accent-color:var(--yellow);width:220px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px;}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}.tbl th{text-align:left;font:600 12px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:6px 8px;border-bottom:1px solid var(--line-2);}.tbl td{padding:8px;border-bottom:1px solid var(--line);font-size:15px;}
.grade-row{display:flex;gap:26px;align-items:center;margin:6px 0 10px;}
.grade{font-family:var(--f-sten);font-weight:800;font-size:clamp(88px,14vw,150px);line-height:.8;color:var(--yellow);min-width:1.1em;}
.bars{display:flex;flex-direction:column;gap:8px;margin:10px 0 16px;max-width:540px;}
.bar{display:grid;grid-template-columns:90px 1fr 36px;gap:10px;align-items:center;font-family:var(--f-ui);font-size:16px;}
.bar i{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;display:block;}.bar em{display:block;height:100%;background:var(--yellow);}
.bar b{text-align:right;font-variant-numeric:tabular-nums;}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:26px;}
.mini-board{margin-top:14px;max-width:420px;}.mini-board h4{font:600 13px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 0 4px;}
@media (max-width:760px){.cols{grid-template-columns:1fr;}.job{grid-template-columns:44px 1fr 56px;}.job-meta{display:none;}.set{grid-template-columns:1fr;}.set small{grid-column:1;}}
/* stow plan */
#plan{position:fixed;inset:0;z-index:12;display:grid;grid-template-rows:auto 1fr auto;background:rgba(7,18,28,.92);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);font-family:var(--f-ui);padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) calc(var(--sab) + 6px) calc(var(--sal) + 10px);touch-action:manipulation;}
.pl-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:2px 4px 8px;border-bottom:1px solid var(--line);}
.pl-title b{font-size:22px;margin-left:8px;}.pl-tabs{display:flex;gap:6px;align-items:center;}.pl-time{margin-left:auto;font-size:16px;color:var(--dim);font-variant-numeric:tabular-nums;}
.pl-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--dim);width:100%;}
.pl-legend span{display:inline-flex;align-items:center;gap:5px;}.pl-legend i{width:12px;height:12px;border-radius:2px;display:inline-block;}
.pl-body{display:grid;grid-template-columns:1fr minmax(250px,330px);gap:10px;min-height:0;}
.pl-canvas{position:relative;min-height:0;min-width:0;}
.pl-canvas canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation;cursor:pointer;}
.pl-side{display:flex;flex-direction:column;gap:12px;overflow-y:auto;min-height:0;padding:6px 4px 0 10px;border-left:1px solid var(--line);}
.pl-sec h4{margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);}
.pl-list{display:flex;flex-direction:column;gap:4px;max-height:190px;overflow-y:auto;}
.pl-item{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:rgba(255,255,255,.04);border:1px solid var(--line);border-left:4px solid var(--c,#888);border-radius:6px;padding:5px 8px;color:var(--ink);cursor:pointer;font-family:var(--f-ui);}
.pl-item b{font-size:15px;}.pl-item span{font-size:13px;color:var(--dim);}.pl-item.sel{border-color:var(--yellow);}
.pl-queue{margin:0;padding:0 0 0 22px;font-size:15px;}.pl-queue li{padding:3px 0;border-bottom:1px solid var(--line);}.pl-queue li b{color:var(--yellow);font-weight:600;}
.pl-empty{font-size:14px;color:var(--faint);font-family:var(--f-body);margin:0;}
.selbox .id{font-size:20px;font-weight:700;}.selbox .meta{font-size:14px;color:var(--dim);font-family:var(--f-body);line-height:1.4;margin:2px 0 8px;}
.opt{display:flex;flex-direction:column;gap:2px;margin-bottom:6px;align-items:flex-start;}.opt small{font-size:12px;color:#ff8a72;font-family:var(--f-body);}
.pl-btns{display:flex;flex-direction:column;gap:8px;position:sticky;bottom:0;background:linear-gradient(0deg,rgba(7,18,28,.99) 72%,rgba(7,18,28,0));padding:12px 0 4px;margin-top:auto;}
.chk{font-size:15px;display:flex;gap:8px;align-items:center;}.chk input{accent-color:var(--yellow);width:18px;height:18px;}
.pl-status{padding:7px 8px 2px;font-size:16px;color:#d6dee3;border-top:1px solid var(--line);min-height:32px;font-family:var(--f-body);}
@media (max-width:900px),(max-height:520px){.pl-body{grid-template-columns:1fr 230px;}.pl-title b{font-size:18px;}.pl-legend{display:none;}.pl-list{max-height:110px;}.pl-status{font-size:13px;min-height:26px;}.pl-top{padding-bottom:4px;}}
#rotate{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;text-align:center;background:var(--bg);padding:24px;font-family:var(--f-body);}
#rotate b{display:block;font-family:var(--f-sten);font-weight:800;font-size:40px;line-height:1;text-transform:uppercase;margin-bottom:10px;color:var(--yellow);}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex;}}
#errbar{position:fixed;left:calc(var(--sal) + 12px);bottom:calc(var(--sab) + 12px);z-index:70;max-width:min(580px,92vw);display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#3a1510;border:1px solid var(--rust);color:#ffd9d0;border-radius:10px;padding:10px 12px;font:500 14px var(--f-body);}
#errbar b{color:#fff;}
@media (prefers-reduced-motion:reduce){.toast,#autoOv .bar i{animation:none;transition:none;}}

/* ---------- ship layout + level generation ---------- */
const Gen={
  rowLabels(n){const out=[],mid=(n-1)/2;for(let i=0;i<n;i++){const off=i-mid;
    if(Math.abs(off)<1e-9)out.push('00');else if(off>0)out.push(pad2(n%2?2*off-1:2*(off+0.5)-1));else out.push(pad2(n%2?-2*off:2*(-off+0.5)));}return out;},
  check(s){const v={};let n=10;for(const ch of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'){if(n%11===0)n++;v[ch]=n;n++;}
    let sum=0;for(let i=0;i<10;i++){const c=s[i];sum+=(c>='0'&&c<='9'?+c:v[c])*Math.pow(2,i);}return (sum%11)%10;},
  layout(key){
    const S=SHIPS[key],L={cls:S,key};
    L.nh=S.holdRows;L.nd=S.deckRows;
    L.rowZ={hold:[],deck:[]};
    for(let i=0;i<L.nh;i++)L.rowZ.hold.push((i-(L.nh-1)/2)*SPEC.rowPitch);
    for(let j=0;j<L.nd;j++)L.rowZ.deck.push((j-(L.nd-1)/2)*SPEC.rowPitch);
    L.rowLab={hold:Gen.rowLabels(L.nh),deck:Gen.rowLabels(L.nd)};
    L.keel=-S.draft;L.tankTop=L.keel+1.8;L.coamingTop=L.tankTop+S.holdTiers*SPEC.H40+0.6;
    L.hatchTop=L.coamingTop+1.0;L.mainDeck=L.coamingTop-2.4;L.halfBeam=S.beam/2;
    L.panelOfHold=[];L.panelRows=[];let i0=0;
    S.panels.forEach((n,p)=>{const rows=[];for(let k=0;k<n;k++){L.panelOfHold.push(p);rows.push(i0+k);}i0+=n;L.panelRows.push(rows);});
    L.deckPanel=[];const off=(L.nd-L.nh)/2;
    for(let j=0;j<L.nd;j++){const hi=j-off;L.deckPanel.push(hi>=0&&hi<L.nh?L.panelOfHold[hi]:-1);}
    const bow=22,stern=14,houseLen=key==='ulcv'?17:15,funLen=11;
    L.len=bow+stern+S.nBays*SPEC.bayPitch+houseLen+(S.funnelAt>=0?funLen:0);
    L.bowX=L.len/2;L.sternX=-L.len/2;L.bays=[];L.house=null;L.funnel=null;
    let x=L.bowX-bow;
    for(let k=0;k<S.nBays;k++){
      if(k===S.houseAt){L.house={x:x-houseLen/2,len:houseLen};x-=houseLen;}
      if(k===S.funnelAt){L.funnel={x:x-funLen/2,len:funLen};x-=funLen;}
      L.bays.push({k,num:4*k+2,x:x-SPEC.bayPitch/2});x-=SPEC.bayPitch;
    }
    if(S.houseAt>=S.nBays){L.house={x:x-houseLen/2,len:houseLen};}
    L.heelPerTm=S.heelBox/(20*0.8*L.halfBeam);
    return L;
  },
  code(L,bayNum,part,row,tier,half){
    const b=half?(half==='f'?bayNum-1:bayNum+1):bayNum;
    return pad2(b)+' '+L.rowLab[part][row]+' '+pad2(part==='hold'?2+2*tier:82+2*tier);
  },
  level(lv){
    const r=makeRng(hashStr('pno|'+lv.id+'|'+lv.seed));
    const L=Gen.layout(lv.cls),S=SHIPS[lv.cls],rot=ROT[lv.cls],feat=lv.feat||{};
    const rank=p=>p==='OAK'?-1:rot.indexOf(p);
    const twin=!!feat.twin,tut=!!lv.tutorial;
    const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
    /* working bays: consecutive, clear of the house and the ends */
    const okK=k=>k>=1&&k<=S.nBays-2&&Math.abs(k-S.houseAt)>1&&(S.funnelAt<0||Math.abs(k-S.funnelAt)>1);
    const starts=[];for(let k=0;k<S.nBays;k++){let g=true;for(let q=0;q<lv.nb;q++)if(!okK(k+q))g=false;if(g)starts.push(k);}
    starts.sort((a,b)=>Math.abs(a-S.nBays*0.55)-Math.abs(b-S.nBays*0.55));
    const k0=starts[Math.min(starts.length-1,Math.floor(r()*Math.min(3,starts.length)))];
    const work=[];for(let q=0;q<lv.nb;q++)work.push(L.bays[k0+q]);
    /* boxes */
    const boxes={},used=new Set();
    const mk=o=>{const line=rpick(r,LINES);let id;
      do{const num=String(rint(r,100000,999999));id=line.code+' '+num+' '+Gen.check(line.code+num);}while(used.has(id));used.add(id);
      const w=Math.round(o.weight*10)/10;
      boxes[id]={id,role:o.role,pod:o.pod,size:o.size||40,kind:o.kind||'dry',weight:w,declared:w,
        cargo:o.cargo||(w<4.3?'Empty':''),line:line.name,col:o.kind==='reefer'?0xe4e8e6:(o.kind==='flat'?0x3b4046:line.col),plan:null};
      if(w<4.3&&o.kind!=='flat')boxes[id].cargo='Empty';
      return id;};
    const anyCargo=()=>r()<0.5?rpick(r,CARGO.imp):rpick(r,CARGO.exp);
    const wImp=()=>r()<0.1?rrange(r,3.8,4.1):rrange(r,8,27);
    const wRob=()=>rrange(r,6,27);
    const wExp=()=>{const q=r();return q<0.3?rrange(r,3.8,4.1):q<0.8?rrange(r,19,28.5):rrange(r,10,19);};
    const unit40=(role,pod,weight,cargo,kind)=>({t:40,id:mk({role,pod,size:40,weight,cargo,kind})});
    const unit20=(role,pod,cargo)=>({t:20,f:mk({role,pod,size:20,weight:rrange(r,12,26),cargo:cargo||anyCargo()}),a:mk({role,pod,size:20,weight:rrange(r,12,26),cargo:cargo||anyCargo()})});
    const ids=u=>u.t===40?[u.id]:[u.f,u.a].filter(Boolean);
    const podOf=u=>boxes[ids(u)[0]].pod;
    const wOf=u=>ids(u).reduce((s,i)=>s+boxes[i].weight,0);
    const isImp=u=>ids(u).some(i=>boxes[i].role==='import');
    const setImport=u=>{for(const i of ids(u)){const b=boxes[i];b.role='import';b.pod='OAK';if(b.cargo!=='Empty')b.cargo=rpick(r,CARGO.imp);}};
    const unitMoves=u=>u.t===40?1:(twin?1:2);
    /* worked panels = hatches that must come off */
    const nP=S.panels.length,worked=work.map(()=>new Set());
    for(let q=0;q<(lv.holdPanels||0);q++){const bi=q%work.length;let p,g=0;do{p=rint(r,0,nP-1);g++;}while(worked[bi].has(p)&&g<30);worked[bi].add(p);}
    const overWorked=(bi,j)=>{const p=L.deckPanel[j];return p>=0&&worked[bi].has(p);};
    const robPods=n=>{const a=[];for(let k=0;k<n;k++)a.push(rpick(r,rot));return a.sort((x,y)=>rank(y)-rank(x));};
    /* 1) the ship as she arrives: cargo for later ports everywhere */
    const bays=work.map(()=>({deck:[],hold:[],covers:S.panels.map(()=>'closed')}));
    bays.forEach((B,bi)=>{
      for(let i=0;i<L.nh;i++){const T=S.holdTiers,hh=rint(r,Math.ceil(T*0.65),T),pods=robPods(hh),st=[];
        for(let k=0;k<hh;k++){if(feat.pairs20&&k===0&&r()<0.3)st.push(unit20('rob',pods[k]));else st.push(unit40('rob',pods[k],wRob(),anyCargo()));}
        B.hold.push(st);}
      for(let j=0;j<L.nd;j++){const T=S.deckTiers,st=[];
        if(overWorked(bi,j)){const hh=rint(r,0,2);
          for(let k=0;k<hh;k++){if(feat.pairs20&&k===0&&r()<0.4)st.push(unit20('import','OAK',rpick(r,CARGO.imp)));else st.push(unit40('import','OAK',wImp(),rpick(r,CARGO.imp)));}}
        else{const hh=tut?rint(r,1,2):rint(r,Math.ceil(T*0.45),T),pods=robPods(hh);
          for(let k=0;k<hh;k++){if(feat.pairs20&&k===0&&r()<0.25)st.push(unit20('rob',pods[k]));else st.push(unit40('rob',pods[k],wRob(),anyCargo()));}}
        B.deck.push(st);}
    });
    /* 2) Oakland boxes in the hold under the worked hatches */
    bays.forEach((B,bi)=>worked[bi].forEach(p=>{
      const rows=shuffle(L.panelRows[p].slice()),n=Math.max(1,Math.round(rows.length*0.45));
      rows.slice(0,n).forEach(i=>{const st=B.hold[i];const k=rint(r,1,Math.min(2,st.length));for(let q=0;q<k;q++)setImport(st[st.length-1-q]);});
    }));
    /* 3) top up Oakland boxes on deck until the import budget is met */
    const impTarget=tut?1:Math.round(lv.moves*0.48);
    const countImp=()=>{let n=0;bays.forEach(B=>['hold','deck'].forEach(pt=>B[pt].forEach(st=>st.forEach(u=>{if(isImp(u))n+=unitMoves(u);}))));return n;};
    let imp=countImp(),guard=0;
    while(imp<impTarget&&guard++<800){
      const bi=rint(r,0,bays.length-1),j=tut?Math.floor(L.nd/2)+rint(r,-1,1):rint(r,0,L.nd-1);
      if(overWorked(bi,j))continue;const st=bays[bi].deck[j];
      let k=st.length-1;while(k>=0&&isImp(st[k]))k--;if(k<0)continue;
      if(st[k].t===20&&!twin&&imp+2>impTarget+1)continue;
      setImport(st[k]);imp+=unitMoves(st[k]);
    }
    /* 4) restows: a few boxes for later ports sitting where they block Oakland cargo */
    const rsTarget=tut?0:Math.max(1,Math.round(lv.moves*0.08));
    let rs=0;guard=0;
    while(rs<rsTarget&&guard++<300){
      const bi=rint(r,0,bays.length-1);
      if(worked[bi].size&&r()<0.5){
        const rows=[];for(let j=0;j<L.nd;j++)if(overWorked(bi,j)&&bays[bi].deck[j].some(u=>u.t===40&&isImp(u)))rows.push(j);
        if(!rows.length)continue;const st=bays[bi].deck[rpick(r,rows)];const cands=st.filter(u=>u.t===40&&isImp(u));
        const u=rpick(r,cands);const b=boxes[u.id];b.role='rob';b.pod=rpick(r,rot);rs++;
      }else{
        const j=rint(r,0,L.nd-1);if(overWorked(bi,j))continue;const st=bays[bi].deck[j];
        if(!st.length||st.length>=S.deckTiers||!isImp(st[st.length-1])||st[st.length-1].t!==40)continue;
        st.push(unit40('rob',rot[0],wRob(),anyCargo()));rs++;
      }
    }
    /* 5) what has to move, what stays */
    const final=bays.map(()=>({deck:[],hold:[]}));
    const info=bays.map(()=>({deck:[],hold:[]}));
    const restowUnits=[];let impMoves=0;
    bays.forEach((B,bi)=>['hold','deck'].forEach(part=>B[part].forEach((st,row)=>{
      let low=st.length;st.forEach((u,k)=>{if(isImp(u)&&k<low)low=k;});
      if(part==='deck'&&overWorked(bi,row))low=0;
      const stays=st.slice(0,low),moving=st.slice(low);
      moving.forEach(u=>{if(isImp(u))impMoves+=unitMoves(u);else{ids(u).forEach(i=>boxes[i].role='restow');restowUnits.push({u,bi,part,row});}});
      final[bi][part][row]=stays.slice();
      info[bi][part][row]={T:part==='hold'?S.holdTiers:S.deckTiers,noWork:moving.length===0,removed:moving.length,returns:[],exports:[]};
    })));
    /* restows: shift straight to a new slot when one is open, otherwise via the quay */
    let restowMoves=0;
    restowUnits.forEach(R=>{
      const up=podOf(R.u);let direct=false;
      if(r()<0.75){
        const c=[];
        final[R.bi].deck.forEach((fs,j)=>{const inf=info[R.bi].deck[j];
          if(!inf.noWork||fs.length>=inf.T||overWorked(R.bi,j))return;
          const top=fs[fs.length-1];
          if(top){if(rank(podOf(top))<rank(up))return;if(R.u.t===20&&top.t===40)return;if(top.t===20&&(!top.f||!top.a))return;}
          c.push(j);});
        if(c.length){const j=rpick(r,c);final[R.bi].deck[j].push(R.u);info[R.bi].deck[j].noWork=false;direct=true;}
      }
      if(direct)restowMoves+=unitMoves(R.u);
      else{info[R.bi][R.part][R.row].returns.push(R.u);restowMoves+=2*unitMoves(R.u);}
    });
    /* 6) exports to fill the rest of the job */
    let expNeed=Math.max(tut?1:2,lv.moves-impMoves-restowMoves),expMoves=0;
    const stacks=[];
    bays.forEach((B,bi)=>['hold','deck'].forEach(part=>B[part].forEach((st,row)=>{
      const inf=info[bi][part][row];
      const free=inf.T-final[bi][part][row].length-inf.returns.length;
      if(free<=0)return;
      let w=0.35;
      if(part==='hold'&&inf.removed>0)w=5;else if(part==='deck'&&overWorked(bi,row))w=2.5;else if(part==='deck'&&inf.removed>0)w=2.2;

/* ---------- environment geometry queries ---------- */
const Env={
  toLocal(G,x,y,z){const O=G.shipO,c=Math.cos(G.phi),s=Math.sin(G.phi);const px=x-O.x,py=y-O.y,pz=z-O.z;return{x:px,y:py*c+pz*s,z:-py*s+pz*c};},
  toWorld(G,x,y,z){const O=G.shipO,c=Math.cos(G.phi),s=Math.sin(G.phi);return{x:O.x+x,y:O.y+y*c-z*s,z:O.z+y*s+z*c};},
  laneZ(n){return SPEC.lanes[n-1].z;},
  alignHold(P,bx,rz,fp){
    const dz=P.z-rz;if(Math.abs(dz)>SPEC.tol.holdZ)return{ok:false};
    if(fp.lx<4){const cf=bx+SPEC.halfOff,ca=bx-SPEC.halfOff;
      if(Math.abs(P.x-cf)<=SPEC.tol.holdX)return{ok:true,half:'f',cx:cf,cz:rz};
      if(Math.abs(P.x-ca)<=SPEC.tol.holdX)return{ok:true,half:'a',cx:ca,cz:rz};return{ok:false};}
    if(Math.abs(P.x-bx)<=SPEC.tol.holdX)return{ok:true,half:null,cx:bx,cz:rz};return{ok:false};
  },
  /* B = world point at the bottom centre of the load (or empty spreader) */
  probe(G,B,fp,car,mode){
    const out={top:SPEC.waterY-60,region:'water',what:'water',seat:null,pick:null,guide:null,note:null};
    Env.quay(G,B,fp,car,mode,out);
    Env.ship(G,B,fp,car,mode,out);
    return out;
  },
  quay(G,B,fp,car,mode,out){
    if(B.z-fp.lz>=0)return;
    const S=G.S;let top=0,what=B.z>=0?'edge':'ground',obj=null;
    for(const lb of S.laneBoxes){const lz=Env.laneZ(lb.lane),hl=(lb.twin||lb.size===40)?SPEC.L40/2:SPEC.L20/2,hh=(lb.size===40&&!lb.twin)?SPEC.H40:SPEC.H20;
      if(Math.abs(B.x-lb.x)<fp.lx+hl-0.08&&Math.abs(B.z-lz)<fp.lz+SPEC.W/2-0.08&&hh>top){top=hh;what='laneBox';obj=lb;}}
    for(const lane of ['A','B'])for(let bi=0;bi<G.work.length;bi++){const st=S.lay[lane][bi];if(!st.length)continue;
      const x=G.work[bi].xw,z=SPEC.lay[lane];if(Math.abs(B.z-z)>=fp.lz+SPEC.W/2-0.08)continue;
      const hh=Rules.halfHeights(st);
      const ovF=B.x+fp.lx>x+0.02&&B.x-fp.lx<x+SPEC.L40/2-0.08,ovA=B.x-fp.lx<x-0.02&&B.x+fp.lx>x-SPEC.L40/2+0.08;
      let t=-1;if(ovF)t=Math.max(t,hh[0]);if(ovA)t=Math.max(t,hh[1]);
      if(t>top){top=t;what='lay';obj={lane,bi,x,z};}}
    if(top<=out.top)return;
    Object.assign(out,{top,region:'quay',what,seat:null,pick:null,note:null,guide:null,obj});
    const tol=SPEC.tol;
    if(car){const sel=car.sel,single20=!sel.twin&&sel.size===20;
      const laySeat=(lane,bi)=>{const x=G.work[bi].xw,z=SPEC.lay[lane];let half=null,cx=x;
        if(single20){half=B.x>=x?'f':'a';cx=x+(half==='f'?1:-1)*SPEC.halfOff;}
        const dx=B.x-cx,dz=B.z-z;if(Math.abs(dx)>tol.layX||Math.abs(dz)>tol.layZ)return false;
        const dst={type:'lay',lane,bi};if(half)dst.half=half;
        const r=Rules.canPlace(G,G.S,sel,dst,false);if(!r.ok){out.note='cant';out.why=r.why;return true;}
        out.seat={dst,tier:r.tier,cx,cz:z,dx,dz,world:true};return true;};
      if(what==='ground'){
        const ln=SPEC.lanes.find(l=>Math.abs(B.z-l.z)<=tol.laneZ);
        if(ln){if(Math.abs(B.x-Phys.c.x)>tol.laneX){out.note='laneX';return;}
          if(ln.n===2){out.note='lane2';return;}
          out.seat={dst:{type:'lane',lane:ln.n,x:B.x},tier:0,cx:B.x,cz:ln.z,dx:0,dz:B.z-ln.z,world:true};return;}
        for(const lane of ['A','B'])for(let bi=0;bi<G.work.length;bi++){if(G.S.lay[lane][bi].length&&!single20)continue;if(laySeat(lane,bi))return;}
        out.note='offLane';
      }else if(what==='lay'){if(!laySeat(obj.lane,obj.bi))out.note='offCones';}
      else if(what==='laneBox')out.note='onBox';

    }else{
      if(what==='laneBox'){const lb=obj,lz=Env.laneZ(lb.lane);
        const m=lb.twin?'twin':(lb.size===40?'40':'20');
        if(m!==mode){out.note='mode'+m;return;}
        if(Math.abs(B.x-lb.x)>tol.pickX||Math.abs(B.z-lz)>tol.pickZ){out.note='offCones';return;}
        out.pick={ids:lb.ids.slice(),size:lb.size,twin:!!lb.twin,cx:lb.x,cz:lz,world:true};
      }else if(what==='lay'){const st=S.lay[obj.lane][obj.bi],u=st[st.length-1];
        const r=Env.pickUnit(u,mode,B.x,obj.x,B.z,obj.z);if(r.note)out.note=r.note;else{r.pick.world=true;out.pick=r.pick;}}
    }
  },
  pickUnit(u,mode,px,bx,pz,rz){
    const tol=SPEC.tol,dz=pz-rz;if(!u)return{note:'empty'};
    if(mode==='40'){if(u.t!==40)return{note:'mode20'};if(Math.abs(px-bx)>tol.pickX||Math.abs(dz)>tol.pickZ)return{note:'offCones'};return{pick:{ids:[u.id],size:40,twin:false,cx:bx,cz:rz}};}
    if(mode==='twin'){if(u.t!==20)return{note:'mode40'};if(!u.f||!u.a)return{note:'half'};if(Math.abs(px-bx)>tol.pickX||Math.abs(dz)>tol.pickZ)return{note:'offCones'};return{pick:{ids:[u.f,u.a],size:20,twin:true,cx:bx,cz:rz}};}
    if(u.t!==20)return{note:'mode40'};
    const half=px>=bx?'f':'a';if(!u[half])return{note:'noHalf'};
    const cx=bx+(half==='f'?1:-1)*SPEC.halfOff;if(Math.abs(px-cx)>tol.pickX||Math.abs(dz)>tol.pickZ)return{note:'offCones'};
    return{pick:{ids:[u[half]],size:20,twin:false,cx,cz:rz,half}};
  },
  ship(G,B,fp,car,mode,out){
    const L=G.L,S=G.S,P=Env.toLocal(G,B.x,B.y,B.z);
    if(P.x<L.sternX-fp.lx||P.x>L.bowX+fp.lx||Math.abs(P.z)>L.halfBeam+fp.lz)return;
    let top=-1e9,what='',cell=null;
    if(Math.abs(P.z)<L.halfBeam&&P.x>L.sternX&&P.x<L.bowX){top=L.mainDeck;what='deck';}
    if(L.house&&Math.abs(P.x-L.house.x)<L.house.len/2+fp.lx&&Math.abs(P.z)<L.halfBeam*0.85+fp.lz){const t=L.mainDeck+G.houseH;if(t>top){top=t;what='house';}}
    if(L.funnel&&Math.abs(P.x-L.funnel.x)<L.funnel.len/2+fp.lx&&Math.abs(P.z)<L.halfBeam*0.5+fp.lz){const t=L.mainDeck+G.houseH*0.8;if(t>top){top=t;what='house';}}
    for(const bay of L.bays){
      if(Math.abs(P.x-bay.x)>SPEC.L40/2+fp.lx+1.3)continue;
      const wi=G.workIdx[bay.k];
      for(const sg of [-1,1]){const bx=bay.x+sg*6.72;
        if(Math.abs(P.x-bx)<fp.lx+0.3&&Math.abs(P.z)<L.halfBeam-0.6+fp.lz){const t=L.hatchTop+2.6;if(t>top){top=t;what='bridge';cell=null;}}}
      for(let j=0;j<L.nd;j++){
        const rz=L.rowZ.deck[j];if(Math.abs(P.z-rz)>=fp.lz+SPEC.W/2-0.2)continue;
        const p=L.deckPanel[j];
        if(wi>=0&&p>=0&&S.bays[wi].covers[p]==='open')continue;
        let hf,ha;if(wi>=0)[hf,ha]=Rules.halfHeights(S.bays[wi].deck[j]);else{const d=G.deco[bay.k];const n=d?d.deck[j].n:0;hf=ha=n*SPEC.H40;}
        const ovF=P.x+fp.lx>bay.x+0.02&&P.x-fp.lx<bay.x+SPEC.L40/2-0.08,ovA=P.x-fp.lx<bay.x-0.02&&P.x+fp.lx>bay.x-SPEC.L40/2+0.08;
        let t=-1e9;if(ovF)t=Math.max(t,L.hatchTop+hf);if(ovA)t=Math.max(t,L.hatchTop+ha);
        if(t>top){top=t;what='deck-stack';cell={bay,wi,part:'deck',row:j,rz};}
      }
      if(wi>=0){let ok=null,gd=null;
        for(let i=0;i<L.nh;i++){const p=L.panelOfHold[i];if(S.bays[wi].covers[p]!=='open')continue;
          const rz=L.rowZ.hold[i];if(Math.abs(P.z-rz)>=fp.lz+SPEC.W/2-0.2)continue;
          if(Math.abs(P.x-bay.x)>SPEC.L40/2+fp.lx-0.1)continue;
          const al=Env.alignHold(P,bay.x,rz,fp);
          if(al.ok){if(!ok||Math.abs(P.z-rz)<Math.abs(P.z-ok.rz)){const hh=Rules.halfHeights(S.bays[wi].hold[i]);ok={i,rz,al,t:L.tankTop+(al.half?(al.half==='f'?hh[0]:hh[1]):Math.max(hh[0],hh[1]))};}}
          else if(!gd)gd={i,rz,al};}
        /* inside a cell's entry flare the guides steer the box in; the neighbouring guides don't catch it */
        if(ok){if(ok.t>top||what==='deck'||what==='guides'){top=ok.t;what='hold-stack';cell={bay,wi,part:'hold',row:ok.i,rz:ok.rz,al:ok.al};}}
        else if(gd&&(L.coamingTop>top||what==='deck')){top=L.coamingTop;what='guides';cell={bay,wi,part:'hold',row:gd.i,rz:gd.rz,al:gd.al};}
      }
    }
    if(top===-1e9)return;
    const topW=G.shipO.y+top*Math.cos(G.phi)-P.z*Math.sin(G.phi);
    if(topW<=out.top)return;
    Object.assign(out,{top:topW,region:'ship',what,seat:null,pick:null,note:null,guide:null,local:P,topL:top,cell});
    if(what==='hold-stack'&&P.y<L.coamingTop+0.05)out.guide={cx:cell.al.cx,cz:cell.al.cz};
    if(!cell||(what!=='deck-stack'&&what!=='hold-stack')){out.note=what==='guides'?'guides':(what==='bridge'?'bridge':(what==='house'?'house':'deck'));return;}
    if(cell.wi<0){out.note='notOurs';return;}
    const isHold=cell.part==='hold';
    if(car){
      const sel=car.sel;let half=null,cx=cell.bay.x;
      if(!sel.twin&&sel.size===20){
        if(isHold){half=cell.al.half;cx=cell.al.cx;}
        else{half=P.x>=cell.bay.x?'f':'a';cx=cell.bay.x+(half==='f'?1:-1)*SPEC.halfOff;}}
      const tx=isHold?SPEC.tol.holdX:SPEC.tol.deckX,tz=isHold?SPEC.tol.holdZ:SPEC.tol.deckZ;

      const r=Rules.canPlace(G,S,sel,dst,false);if(!r.ok){out.note='cant';out.why=r.why;return;}

      const r=Env.pickUnit(u,mode,P.x,cell.bay.x,P.z,cell.rz);

  }

/* ---------- the crane ---------- */
const Phys={
  c:null,pr:null,clear:0,
  reset(x,z,y){this.c={x,vx:0,z,vz:0,y,vy:0,thx:0,wx:0,thz:0,wz:0,ax:0,az:0,landed:null,inGuides:null,mode:'40',slack:false,sideCool:0,ox:0,oz:0};this.pr=null;},
  ropeLenOf(y){const C=SPEC.crane;return Math.max(2.2,C.pivotY-(C.sprH+C.headH)-y);},
  ropeLen(){return this.ropeLenOf(this.c.y);},
  poseOf(s){const C=SPEC.crane,L=this.ropeLenOf(s.y);
    if(s.inGuides)return{x:s.inGuides.x,z:s.inGuides.z,y:C.pivotY-(C.sprH+C.headH)-L,L};
    return{x:s.x+L*Math.sin(s.thx),z:s.z+L*Math.sin(s.thz),y:C.pivotY-(C.sprH+C.headH)-L*Math.cos(s.thx)*Math.cos(s.thz),L};},
  pose(){return this.poseOf(this.c);},
  fp(G){const car=G.carry,c=this.c;let lx;
    if(car)lx=(car.sel.twin||car.sel.size===40)?SPEC.L40/2:SPEC.L20/2;else lx=c.mode==='20'?SPEC.L20/2:SPEC.L40/2;
    return{lx,lz:SPEC.W/2};},
  bottom(G){const P=this.pose(),hh=G.carry?G.carry.h:0;return{x:P.x,y:P.y-hh,z:P.z};},
  step(G,dt,inp){

    const mSpr=(c.mode==='twin'?C.twinMass:C.sprMass)+C.headMass,mTot=(mSpr+mLoad)*1000;
    const heavy=clamp(mLoad/25,0,1);
    let vH=lerp(C.vHoistEmpty,C.vHoistLoaded,heavy);if(car&&car.flat)vH*=0.5;if(mLoad>32)vH*=0.8;
    let tH=inp.hoist*vH*(inp.fine?0.12:1);
    if(tH>0){const room=C.liftMax-c.y;if(room<4)tH=Math.min(tH,Math.max(0.04,room*0.35));if(room<=0)tH=0;}
    if(tH<0){const room=c.y-C.liftMin;if(room<3)tH=Math.max(tH,-Math.max(0.04,room*0.4));if(room<=0)tH=0;}
    c.slack=false;if(c.landed&&tH<0){tH=0;c.slack=true;}

    let tT=inp.trolley*C.vTrolley*(inp.fine?0.15:1),tG=inp.gantry*C.vGantry*(inp.fine?0.2:1);
    if(c.landed||c.inGuides){tT=0;tG=0;}
    /* anti-sway works through the drives, like the real thing: the speed reference chases the load's swing.
       Swing is measured against a slow average of the rope angle: a steady wind holds the rope at a fixed angle
       whatever its length, so lowering or hoisting in wind doesn't make the trolley creep. */
    const hanging=!c.landed&&!c.inGuides;
    if(hanging){const Lr=this.ropeLen(),k=Math.min(1,dt/18);c.oz+=(c.thz-c.oz)*k;c.ox+=(c.thx-c.ox)*k;
      if(G.assist>0){const K=1.1*G.assist;tT=clamp(tT+K*Lr*Math.sin(c.thz-c.oz),-C.vTrolley,C.vTrolley);tG=clamp(tG+K*Lr*Math.sin(c.thx-c.ox),-C.vGantry,C.vGantry);}}
    else{c.oz=0;c.ox=0;}

    if(tT<0&&c.z-C.zMin<6)tT=Math.max(tT,-Math.max(0.1,(c.z-C.zMin)*0.6));
    const gx=G.gantryLimit;if(tG>0&&gx[1]-c.x<4)tG=Math.min(tG,Math.max(0.05,(gx[1]-c.x)*0.3));if(tG<0&&c.x-gx[0]<4)tG=Math.max(tG,-Math.max(0.05,(c.x-gx[0])*0.3));

    c.z=clamp(c.z+c.vz*dt,C.zMin,C.zMax);if(c.z===C.zMin||c.z===C.zMax)c.vz=0;

    if(!c.landed&&!c.inGuides){

      const long=car?((car.sel.twin||car.sel.size===40)?SPEC.L40:SPEC.L20):11.5,hh=car?car.h:0.9;
      const Az=long*hh,Ax=SPEC.W*hh;
      const rz=w.z-(c.vz+L*Math.cos(c.thz)*c.wz),rx=w.x-(c.vx+L*Math.cos(c.thx)*c.wx);/* wind relative to the moving load */
      const Fz=0.5*SPEC.rho*1.2*Az*rz*Math.abs(rz),Fx=0.5*SPEC.rho*1.2*Ax*rx*Math.abs(rx);
      const az=-(SPEC.g/L)*Math.sin(c.thz)-(c.az/L)*Math.cos(c.thz)-(2*Ld/L)*c.wz-damp*c.wz+(Fz/(mTot*L))*Math.cos(c.thz);
      const ax=-(SPEC.g/L)*Math.sin(c.thx)-(c.ax/L)*Math.cos(c.thx)-(2*Ld/L)*c.wx-damp*c.wx+(Fx/(mTot*L))*Math.cos(c.thx);

  contact(G,dt,prev){

      const W=Env.toWorld(G,pr.guide.cx,pr.topL||0,pr.guide.cz);
      c.inGuides={x:W.x,z:W.z,lx:pr.guide.cx,lz:pr.guide.cz};c.thx=c.thz=c.wx=c.wz=0;c.vx=c.vz=0;
      P=this.pose();B={x:P.x,y:P.y-hh,z:P.z};pr=Env.probe(G,B,fp,car,c.mode);G.onGuides(true);
    }
    if(c.inGuides){const Pl=Env.toLocal(G,B.x,B.y,B.z);
      if(Pl.y>G.L.coamingTop+0.35){const L=this.ropeLen();
        c.thx=Math.asin(clamp((c.inGuides.x-c.x)/L,-0.4,0.4));c.thz=Math.asin(clamp((c.inGuides.z-c.z)/L,-0.4,0.4));
        c.wx=c.wz=0;c.inGuides=null;G.onGuides(false);P=this.pose();B={x:P.x,y:P.y-hh,z:P.z};pr=Env.probe(G,B,fp,car,c.mode);}
      else{/* the cell moves with the ship as it heels; the guides carry the box with it */const g=c.inGuides,Wn=Env.toWorld(G,g.lx,Pl.y,g.lz);
        if(Math.abs(Wn.x-g.x)>1e-6||Math.abs(Wn.z-g.z)>1e-6){c.inGuides={x:Wn.x,z:Wn.z,lx:g.lx,lz:g.lz};P=this.pose();B={x:P.x,y:P.y-hh,z:P.z};pr=Env.probe(G,B,fp,car,c.mode);}}}
    this.pr=pr;this.clear=B.y-pr.top;
    if(pr.region==='water'&&B.y<SPEC.waterY+0.3){G.onWater();return;}
    const cosT=Math.max(0.3,Math.cos(c.thx)*Math.cos(c.thz));
    if(c.landed){
      if(c.vy>0.001&&B.y>pr.top+0.02){c.landed=null;G.onLiftOff();return;}
      if(B.y<pr.top-0.001){c.y+=(pr.top-B.y)/cosT;}

    if(G.breakdownAt>=0&&G.stats.moves>=G.breakdownAt){G.breakdownAt=-1;this.radio('breakdown');
      this.startAuto('breakdown',{dur:rint(G.rng,10,18)*60,real:5,label:'Crane down',sub:'Hoist drive fault. Maintenance is on it.',onDone:()=>this.afterMoveResume()});return;}
    this.afterMoveResume();},
  afterMoveResume(){const G=this.G;
    if(!G.queue.length){if(G.tut){G.queue=Rules.autoPlan(G,G.S,6);Plan.describe(G);if(G.queue.length){this.prepHead();return;}}this.openPlan('Plan the next moves.');return;}
    this.prepHead();},
  onSpreaderLanded(v,pr){const G=this.G;
    if(pr.what==='cab'){this.catastrophic('injury','The spreader came down on a truck cab with the driver inside.');return;}
    Snd.clunk(clamp(v/2.5,0.12,0.8));
    if(['deck-stack','hold-stack','laneBox','lay'].includes(pr.what)&&v>1.2){const big=v>2;this.damage(big?5000:900,big?'Spreader crushed a container roof':'Spreader slammed a roof');this.radio('hard');}
    if(pr.pick){G.pickCand={pick:pr.pick,t:0};const W=pr.pick.world?{x:pr.pick.cx,z:pr.pick.cz}:Env.toWorld(G,pr.pick.cx,pr.topL||0,pr.pick.cz);Phys.settleTo(G,W.x,W.z);}
    else if(pr.note)this.hint(this.noteText(pr.note,pr));},
  onLoadLanded(v,pr){const G=this.G,car=G.carry;
    if(pr.what==='cab'){if(v>0.25)this.catastrophic('injury','A container came down on a truck cab with the driver inside.');else{G.stats.nearMiss++;this.fine(5000,'Box set on a truck cab');this.radio('nearMiss');}return;}
    const q=this.landGrade(v);Snd.clunk(clamp(v/1.1,0.2,1.3));G.lastHard=v>0.6;
    if(q.crushed){this.damage(car.sel.ids.reduce((s,id)=>s+this.cargoValue(G.boxes[id]),0),'Crushed box');if(car.haz)this.fine(50000,'Hazmat release, spill response');}
    else if(q.cost)this.damage(q.cost,q.label);
    if(pr.seat){G.seatCand={seat:pr.seat,t:0};G.stats.landScores.push(q.score);
      if(q.key==='clean'){G.stats.clean++;if(G.rng()<0.3)this.radio('clean');}else this.radio(q.key);
      const s=pr.seat,W=s.world?{x:s.cx,z:s.cz}:Env.toWorld(G,s.cx,pr.topL||0,s.cz);Phys.settleTo(G,W.x,W.z);}
    else{G.stats.misaligned++;G.stats.landScores.push(Math.min(q.score,30));this.radio(pr.note==='lane2'?'laneWrong':'miss');this.hint(this.noteText(pr.note,pr));}},
  landGrade(v){if(v<=0.3)return{score:100,label:'Clean landing',key:'clean',cost:0};if(v<=0.6)return{score:75,label:'Firm landing',key:'firm',cost:0};
    if(v<=0.9)return{score:40,label:'Hard landing',key:'hard',cost:1200};if(v<=1.25)return{score:10,label:'Box damaged',key:'heavy',cost:6500};return{score:0,label:'Crushed box',key:'crushed',cost:0,crushed:true};},
  cargoValue(b){return b.cargo==='Empty'?4000:(b.kind==='reefer'?62000:(b.kind==='haz'?95000:(b.kind==='flat'?140000:38000)));},
  onSideImpact(v,pr){const G=this.G;
    if(pr.what==='cab'){if(v>0.8)this.catastrophic('injury','The load swung into a truck cab.');else{this.fine(5000,'Load hit a truck cab');this.radio('side');}return;}
    if(v<0.2)return;G.stats.sideImpacts++;Snd.clunk(clamp(v,0.3,1));if(v>1.0)this.damage(8000,'Side impact, box damaged');else if(v>0.4)this.damage(2000,'Scraped the stack');this.radio('side');},
  onLiftOff(){const G=this.G;G.pickCand=null;G.seatCand=null;},
  onWater(){const G=this.G;if(this.state!=='run')return;const car=G.carry,c=Phys.c;
    if(car){car.sel.ids.forEach(id=>{G.S.loc[id]={type:'lost'};Rules.dropFromPlan(G,id);});G.carry=null;G.stats.drops++;this.damage(150000,'Box lost overboard');
      this.say('Walking boss','Box in the water! Everybody stop!');G.dirty=true;if(G.queue[0]&&G.queue[0].sel.ids.some(i=>car.sel.ids.includes(i)))G.queue.shift();}
    else this.damage(40000,'Spreader in the bay');
    c.y=Math.max(c.y,SPEC.waterY+8);c.vy=0;c.landed=null;
    this.startAuto('investigation',{dur:1200,real:4,label:'Stop work',sub:'The terminal and harbor patrol are investigating.',onDone:()=>this.afterMove()});},
  catastrophic(kind,text){const G=this.G;if(!G||this.state==='incident')return;this.state='incident';this.incidentKind=kind;G.auto=null;HUD.auto(null);HUD.tut(null);
    HUD.banner('Stop work','','alarm');Snd.beep('alarm');Snd.say('Stop work. Stop work.');
    const c=Save.data.career;c.incidents=(c.incidents||0)+1;const second=c.incidents>=2;if(second)c.fired=true;else c.balance-=12000;Save.save();
    setTimeout(()=>{if(this.state==='incident'&&this.G===G){HUD.banner(null);UI.incident(G,kind,text,second);}},1800);},
  finish(cut){const G=this.G;if(this.state==='depart'||this.state==='report')return;G.stats.endClock=G.clock;G.cut=cut;
    this.say('Walking boss',cut?'That\'s it. The line is cutting the rest. She sails now.':rpick(Math.random,RADIO.done));Snd.horn();
    this.state='depart';this.camMode='depart';this.departT=0;R.startDepart();HUD.banner(null);HUD.tut(null);HUD.auto(null);Plan.close();},
  departTick(dt){const G=this.G;this.departT+=dt;const t=this.departT;
    G.departZ=Math.pow(Math.max(0,t-1.5),2)*1.1;G.departX=Math.pow(Math.max(0,t-2.5),2)*1.8;if(t>7.5)this.report();},
  report(){const G=this.G,res=this.score(G);this.state='report';
    if(!G.lv.tutorial){const c=Save.data.career,prev=c.done[G.lv.id];if(!G.cut&&(!prev||res.total>prev.score))c.done[G.lv.id]={score:Math.round(res.total),grade:res.grade};
      c.balance+=res.money.net;Save.save();
      if(!G.cut)res.rank=Save.addScore(G.lv.id,{name:Save.data.callsign||'Operator',score:Math.round(res.total*10),grade:res.grade,gmph:+res.gmph.toFixed(1),date:new Date().toISOString().slice(0,10)});}
    else{Save.data.career.tutorialDone=true;Save.save();}
    UI.report(G,res);},
  score(G){const s=G.stats,lv=G.lv,pace=TIER_PACE[lv.tier]||16,start=s.startClock!=null?s.startClock:lv.start,end=s.endClock!=null?s.endClock:G.clock;
    const worked=Math.max(1,end-start-s.breakMins-s.downMins),gmph=s.moves/(worked/60),late=Math.max(0,end-G.etd),early=Math.max(0,G.etd-end);
    const speed=clamp(50+(gmph-pace)/Math.max(4,40-pace)*50-late*1.5,0,100);
    const ls=s.landScores.length?s.landScores.reduce((a,b)=>a+b,0)/s.landScores.length:60;
    const precision=clamp(ls-3*s.sideImpacts,0,100),damage=clamp(100-s.damage/500,0,100),extra=Math.max(0,s.moves-G.minMoves);
    const plan=clamp(100-10*extra-12*s.misStows,0,100),safety=clamp(100-8*s.overPeople-25*s.nearMiss-20*s.stopViol-10*s.unreported+5*s.reported,0,100);
    let total=0.30*speed+0.20*precision+0.20*damage+0.15*plan+0.15*safety;if(G.cut)total=Math.min(total,55);
    const grade=total>=93?'A+':total>=88?'A':total>=80?'B':total>=70?'C':total>=60?'D':'F';
    const pay=s.moves*185,bonusEarly=G.cut?0:Math.round(early)*40,latePen=Math.round(late)*300,clean=(!G.cut&&s.damage===0&&safety>=100&&lv.tier>0)?1500*lv.tier:0,cutPen=G.cut?25000:0,bonus=s.bonus||0;
    const net=pay+bonusEarly+clean+bonus-latePen-s.damage-s.fines-cutPen;
    return{total,grade,speed,precision,damage,plan,safety,gmph,worked,late,early,extra,money:{pay,bonusEarly,clean,bonus,latePen,damage:s.damage,fines:s.fines,cutPen,net}};},
  fine(n,label){this.G.stats.fines+=n;HUD.toast(label,-n,'bad');},
  damage(n,label){this.G.stats.damage+=n;HUD.toast(label,-n,'bad');},
  hint(t){if(!t)return;const now=performance.now();if(this._hintT&&now-this._hintT<1800&&this._hintS===t)return;this._hintT=now;this._hintS=t;HUD.toast(t,0,'hint');},
  speaker(k){return({listCaution:'Chief mate',stopWork:'Chief mate',breakdown:'Maintenance',heavy:'Walking boss',crushed:'Walking boss',misstow:'Walking boss',violation:'Walking boss',
    windStop:'Walking boss',windGo:'Walking boss',reported:'Walking boss',breakTime:'Walking boss',sail30:'Walking boss',late:'Walking boss',done:'Walking boss',robOnLane:'Walking boss'})[k]||'Signalman';},
  radio(k){const lines=RADIO[k];if(!lines)return;const now=performance.now();if(this.lastRadio[k]&&now-this.lastRadio[k]<7000)return;this.lastRadio[k]=now;
    this.say(this.speaker(k),lines[Math.floor(Math.random()*lines.length)]);},
  say(who,text){HUD.radio(who,text);Snd.squelch();setTimeout(()=>Snd.say(text),160);},
  noteText(n,pr){return({offCones:'Off the cones. Lift a little and line up.',guides:'Hung up on the cell guides. Lift and line up with the cell.',bridge:'That\'s the lashing bridge. Line up with the bay.',
    deck:'Nothing to land on there.',house:'That\'s the accommodation block!',notOurs:'That bay belongs to another gang.',cant:(pr&&pr.why)||'That slot isn\'t ready.',
    lane2:'Lane 2 is exports only. Discharge to lane 1 or 3.',noTruck:'No truck under you. Wait for one in lane 1 or 3.',offLane:'Off the lanes. Boxes go on a truck or in restow A or B.',
    offChassis:'Not square on the chassis. Lift and line up.',truckBusy:'That truck isn\'t ready for you.',onBox:'There\'s a box there already.',edge:'That\'s the edge of the wharf!',
    mode20:'Those are 20s. Check your move.',mode40:'That\'s a 40. Check your move.',modetwin:'That\'s a twin pair. Check your move.',half:'Twin-lift needs both 20s in the slot.',
    noHalf:'No box in that half.',empty:'Nothing there to pick.',cab:'Truck cab!'})[n]||'';},
  markers(){const G=this.G;if(!G||this.state!=='run')return null;const m=G.queue[0];if(!m)return null;
    const out={},sel=m.sel,len=(sel.twin||sel.size===40)?SPEC.L40:SPEC.L20,hh=(sel.size===40&&!sel.twin)?SPEC.H40:SPEC.H20;
    const off=half=>half?(half==='f'?1:-1)*SPEC.halfOff:0;
    if(!G.carry){const loc=G.S.loc[sel.ids[0]],half=sel.twin?null:(loc.half||null);
      if(loc.type==='ship'){const st=G.S.bays[loc.bi][loc.part][loc.row];
        let y=(loc.part==='hold'?G.L.tankTop:G.L.hatchTop)+Rules.heightBelow(st,loc.tier,half)+hh/2;if(loc.part==='hold'&&!Phys.c.inGuides)y=Math.max(y,G.L.coamingTop+hh/2+0.3);
        out.pick={local:true,x:G.work[loc.bi].x+off(half),y,z:G.L.rowZ[loc.part][loc.row],len,h:hh};}
      else if(loc.type==='lay'){const st=G.S.lay[loc.lane][loc.bi];out.pick={x:G.work[loc.bi].xw+off(half),y:Rules.heightBelow(st,loc.tier,half)+hh/2,z:SPEC.lay[loc.lane],len,h:hh};}
      else if(loc.type==='lane'){const tk=G.trucks[loc.lane-1];if(tk&&tk.state==='waiting')out.pick={x:tk.x,y:CHASSIS+hh/2,z:Env.laneZ(loc.lane),len,h:hh};else out.waitExport=true;}}
    else if(this.sameIds(G.carry.sel.ids,sel.ids)){const d=m.dst,h2=G.carry.h,half=sel.twin?null:(d.half||null);
      if(d.type==='ship'){const st=G.S.bays[d.bi][d.part][d.row],r=Rules.canPlace(G,G.S,sel,d,false),tier=r.ok?r.tier:st.length;
        let y=(d.part==='hold'?G.L.tankTop:G.L.hatchTop)+Rules.heightBelow(st,tier,half)+h2/2;if(d.part==='hold'&&!Phys.c.inGuides)y=Math.max(y,G.L.coamingTop+h2/2+0.3);
        out.drop={local:true,x:G.work[d.bi].x+off(half),y,z:G.L.rowZ[d.part][d.row],len,h:h2};}
      else if(d.type==='lay'){const st=G.S.lay[d.lane][d.bi],r=Rules.canPlace(G,G.S,sel,d,false),tier=r.ok?r.tier:st.length;
        out.drop={x:G.work[d.bi].xw+off(half),y:Rules.heightBelow(st,tier,half)+h2/2,z:SPEC.lay[d.lane],len,h:h2};}
      else{const P=Phys.pose(),tks=G.trucks.filter(t=>t.lane!==2&&t.state==='waiting'&&!t.ids).sort((a,b)=>Math.abs(Env.laneZ(a.lane)-P.z)-Math.abs(Env.laneZ(b.lane)-P.z));
        if(tks.length)out.drop={x:tks[0].x,y:CHASSIS+h2/2,z:Env.laneZ(tks[0].lane),len,h:h2};else out.wait=true;}}
    return out;},
  /* ---------- quick training ---------- */
  tutSteps(){const c=Phys.c,G=this.G,t=G.tut,m=isCoarse;return[
    {text:m?'You\'re in the cab, 170 feet up. Drag on the view to look around, then tap Next.':'You\'re in the cab, 170 feet up. Drag with the mouse to look around, then press Next.',next:true},
    {text:m?'Push the left stick up to trolley out over the ship, down to come back over the quay.':'W trolleys out over the ship. S brings you back over the quay. Try it.',done:()=>Math.abs(c.z-t.z0)>5},
    {text:m?'Push the left stick sideways to gantry the whole crane along the rails.':'A and D gantry the whole crane along the rails. Nudge it a little.',done:()=>Math.abs(c.x-t.x0)>0.8},
    {text:m?'The right slider runs the hoist. Fine slows everything down for precise work.':'The up and down arrows run the hoist. Hold Shift for fine speed.',done:()=>Math.abs(c.y-t.y0)>4},
    {text:'Line up over the box outlined in blue and lower gently. The twistlocks lock by themselves a moment after you land.',done:()=>!!G.carry},
    {text:'Hoist clear of the stacks, then trolley back over the quay. Set the box on the empty truck in lane 1 or 3, square on the chassis.',done:()=>G.stats.moves>=1},
    {text:'Now the export on the truck in lane 2. Pick it up and land it in the yellow ghost slot on the ship.',done:()=>G.stats.moves>=2},
    {text:'One more export. On real jobs you plan every move on the stow plan first ('+(m?'the Plan button':'Tab')+').',done:()=>false}];},
  tutShow(){const G=this.G,s=this.tutSteps()[G.tut.step];HUD.tut(s?s.text:null,!!(s&&s.next));},
  tutTick(){const G=this.G,s=this.tutSteps()[G.tut.step];
    if(s&&s.done&&s.done()){G.tut.step++;G.tut.x0=Phys.c.x;G.tut.z0=Phys.c.z;G.tut.y0=Phys.c.y;this.tutShow();Snd.beep('ok');}},
  tutNext(){const G=this.G;if(!G||!G.tut)return;G.tut.step++;G.tut.x0=Phys.c.x;G.tut.z0=Phys.c.z;G.tut.y0=Phys.c.y;this.tutShow();},
  tutSkip(){Save.data.career.tutorialDone=true;Save.save();this.quit();}
};
window.PNO={Game,Plan,UI,HUD,Input,Phys,Env,Rules,Gen,R,Save,SPEC,LEVELS,TUTORIAL,Snd};
Game.init();

}
